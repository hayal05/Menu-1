<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Saba Coffee - ሳባ ቡና | ምግብ ዝርዝር</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Abyssinica+SIL&family=Anta&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@500;600;700;800&family=Pacifico&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E8672B;
    --orange-dark:#C94E1B;
    --orange-light:#F4914F;
    --gold:#D9A441;
    --coffee:#3D2015;
    --coffee-soft:#5A3826;
    --cream:#FFF8F0;
    --plate:#FFFFFF;
    --ink:#3D2015;
    --muted:#9A7E6E;
    --shadow: 0 2px 12px rgba(61,32,21,0.10);
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans Ethiopic','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .brand-font{font-family:var(--brand-title-font, 'Noto Serif Ethiopic','Noto Sans Ethiopic',serif);}

  /* ---------- powered-by footer line ---------- */
  .powered-by{
    font-size:11px; letter-spacing:0.6px;
    color:rgba(255,255,255,0.4); margin-top:14px; text-transform:uppercase;
  }
  .powered-by span{ font-family:'Anta',sans-serif; color:rgba(255,255,255,0.65); }

  /* ---------- loading spinner (coffee cup + rising steam) ---------- */
  .spinner-cup{ display:inline-block; vertical-align:middle; color:#fff; margin-right:8px; }
  .spinner-cup.spinner-dark{ color:var(--orange); }
  .spinner-cup.sm{ width:18px; height:18px; }
  .spinner-cup.md{ width:28px; height:28px; margin-right:0; }
  .spinner-cup.lg{ width:190px; height:190px; margin-right:0; }
  .spinner-cup .cup-outline{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .spinner-cup .steam{ stroke:currentColor; stroke-width:1.6; stroke-linecap:round; fill:none; opacity:0; transform-origin:12px 20px; animation:steamRise 1.3s ease-in-out infinite; }
  .spinner-cup .steam.s2{ animation-delay:.22s; }
  .spinner-cup .steam.s3{ animation-delay:.44s; }
  @keyframes steamRise{
    0%{ transform:translateY(2px) scaleY(0.5); opacity:0; }
    35%{ opacity:1; }
    100%{ transform:translateY(-5px) scaleY(1.05); opacity:0; }
  }
  /* ---------- loading spinner (spinning restaurant logo, once one is set) ---------- */
  .spinner-logo{
    display:inline-block; vertical-align:middle; margin-right:8px;
    border-radius:50%; object-fit:cover;
    box-shadow:0 0 0 2px rgba(255,255,255,0.35);
    animation:spinnerLogoSpin 1s linear infinite;
  }
  .spinner-logo.sm{ width:18px; height:18px; }
  .spinner-logo.md{ width:28px; height:28px; margin-right:0; }
  .spinner-logo.lg{ width:190px; height:190px; margin-right:0; }
  @keyframes spinnerLogoSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .btn[disabled]{ opacity:0.85; cursor:wait; pointer-events:none; }
  .loading-block{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:40px 20px; color:var(--muted); font-size:14px;
  }

  /* ---------- background texture ---------- */
  .bg-rings{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .bg-rings span{
    position:absolute; border-radius:50%; border:2px solid rgba(232,103,43,0.06);
  }

  /* ---------- header ---------- */
  header.top{
    position:relative; z-index:2;
    background:linear-gradient(160deg, var(--orange) 0%, var(--orange-dark) 55%, var(--coffee) 130%);
    padding:26px 20px 22px;
    border-radius:0 0 28px 28px;
    box-shadow:0 6px 24px rgba(61,32,21,0.22);
    overflow:hidden;
  }
  .header-inner{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:14px; max-width:640px; margin:0 auto;
  }
  .jebena{ width:52px; height:52px; flex-shrink:0; opacity:0.95; }
  .jebena.profile-pic{
    border-radius:50%; object-fit:cover; opacity:1;
    border:2px solid rgba(255,255,255,0.55); background:rgba(255,255,255,0.15);
  }
  .brand-text h1{
    margin:0; color:#fff; font-size:22px; line-height:1.25; font-weight:700;
    letter-spacing:0.2px;
  }
  .brand-text .sub-en{
    display:block; font-family:'Noto Sans Ethiopic',sans-serif; font-size:11px; font-weight:500;
    letter-spacing:2.5px; text-transform:uppercase; color:rgba(255,255,255,0.75); margin-top:2px;
  }
  .brand-text .tagline{
    margin:6px 0 0; color:rgba(255,255,255,0.88); font-size:13px; font-weight:500;
  }
  .steam{
    position:absolute; right:-10px; top:-20px; width:140px; height:140px; opacity:0.10;
  }

  /* ---------- category chips ---------- */
  .cat-nav-wrap{ position: sticky; top:0; z-index:5; background:var(--cream); padding:14px 0 6px; }
  .cat-nav-scroller{ position:relative; max-width:640px; margin:0 auto; }
  .cat-nav{
    display:flex; gap:10px; overflow-x:auto; overflow-y:hidden; padding:4px 20px 10px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
    touch-action:pan-x; overscroll-behavior-x:contain;
    position:relative; z-index:2;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-nav-fade{
    position:absolute; top:4px; bottom:10px; width:34px; pointer-events:none; z-index:1;
    opacity:0; transition:opacity .18s ease;
  }
  .cat-nav-fade.left{ left:0; background:linear-gradient(to right, var(--cream), rgba(255,248,240,0)); }
  .cat-nav-fade.right{ right:0; background:linear-gradient(to left, var(--cream), rgba(255,248,240,0)); }
  .cat-nav-fade.show{ opacity:1; }
  .cat-chip{
    flex-shrink:0; padding:10px 18px; border-radius:999px; border:2px solid rgba(232,103,43,0.18);
    background:#fff; color:var(--orange-dark); font-weight:600; font-size:14px; cursor:pointer;
    white-space:nowrap; transition:all .18s ease; font-family:'Noto Sans Ethiopic',sans-serif;
  }
  .cat-chip:hover{ border-color: var(--orange); }
  .cat-chip.active{
    background:linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(232,103,43,0.35);
  }

  /* ---------- main / grid ---------- */
  main{ position:relative; z-index:1; max-width:640px; margin:0 auto; padding:8px 16px 60px; }
  .cat-heading{
    display:flex; align-items:baseline; gap:10px; margin:18px 4px 14px;
  }
  .cat-heading h2{ margin:0; font-size:19px; font-weight:700; }
  .cat-heading .count{ font-size:12px; color:var(--muted); font-weight:500; }

  .grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:520px){ .grid{ grid-template-columns:1fr 1fr; } }

  .item-card{
    position:relative; background:var(--plate); border-radius:var(--radius);
    padding:18px 16px 16px; box-shadow:var(--shadow);
    display:flex; gap:12px; align-items:flex-start; overflow:hidden;
    animation:riseIn .35s ease both;
  }
  .item-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg, var(--gold), var(--orange) 45%, var(--gold));
  }
  .item-card::after{
    content:""; position:absolute; inset:9px; border-radius:14px;
    border:1px dashed rgba(232,103,43,0.14); pointer-events:none;
  }
  @keyframes riseIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .item-icon{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #FFF3E4, var(--cream));
    box-shadow:inset 0 0 0 2px rgba(232,103,43,0.20);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    overflow:hidden;
  }
  .item-icon img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  /* Item cards with an uploaded photo get a bigger square picture that fills
     the card's height, instead of the small emoji circle. */
  .item-card.has-photo{ align-items:stretch; }
  .item-card.has-photo .item-icon{
    width:96px; height:auto; align-self:stretch; border-radius:14px;
    box-shadow:inset 0 0 0 2px rgba(232,103,43,0.20), 0 3px 8px rgba(61,32,21,0.12);
  }
  .item-card.has-photo .item-icon img{
    border-radius:14px; cursor:zoom-in;
  }
  @media(min-width:520px){ .item-card.has-photo .item-icon{ width:110px; } }
  .item-body{ flex:1; min-width:0; }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .item-name{ font-weight:700; font-size:15.5px; line-height:1.3; }
  .item-name-en{ display:block; font-size:11.5px; color:var(--muted); font-weight:500; margin-top:1px; }
  .item-desc{ font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .price-pill{
    flex-shrink:0; background:linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff; padding:6px 13px; border-radius:999px; font-weight:700; font-size:13px;
    white-space:nowrap; box-shadow:0 3px 8px rgba(232,103,43,0.3);
  }
  .unavailable-badge{
    display:inline-block; margin-top:8px; font-size:11px; font-weight:700; color:#B23A2B;
    background:#FBE3DD; padding:3px 9px; border-radius:999px;
  }
  .item-card.is-unavailable{ opacity:0.55; }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--muted);
  }
  .empty-state .emoji{ font-size:38px; display:block; margin-bottom:10px; }

  /* ---------- footer ---------- */
  footer{
    position:relative; z-index:1; background:var(--coffee); color:#fff;
    text-align:center; padding:34px 20px 26px; margin-top:20px;
    border-radius:28px 28px 0 0;
  }
  footer .foot-brand{ font-size:20px; font-weight:700; letter-spacing:0.5px; }
  footer .foot-sub{ font-size:12px; color:rgba(255,255,255,0.55); margin-top:8px; letter-spacing:1px; }

  /* ---------- admin trigger ---------- */
  .admin-fab{
    position:relative; margin:16px 0 0; left:0; z-index:3;
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(0,0,0,0.18); color:#fff; box-shadow:0 4px 14px rgba(61,32,21,0.22);
    display:flex; align-items:center; justify-content:center; font-size:17px;
    backdrop-filter:blur(4px); transition:transform .15s ease, background .15s ease;
  }
  .admin-fab:hover{ transform:scale(1.06); background:rgba(0,0,0,0.3); }

  /* ---------- cart trigger ---------- */
  .cart-fab{
    position:fixed; left:16px; bottom:16px; z-index:20;
    min-width:46px; height:46px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--orange), var(--orange-dark)); color:#fff;
    box-shadow:0 6px 18px rgba(232,103,43,0.4);
    display:flex; align-items:center; justify-content:center; gap:6px; font-size:19px;
    padding:0 16px 0 14px; transition:transform .15s ease;
  }
  .cart-fab:hover{ transform:scale(1.05); }
  .cart-fab .cart-total{ font-size:13px; font-weight:700; font-family:'Noto Sans Ethiopic',sans-serif; }
  .cart-fab .cart-badge{
    position:absolute; top:-6px; right:-6px; background:var(--coffee); color:#fff;
    min-width:20px; height:20px; padding:0 4px; border-radius:999px; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .cart-fab.is-empty{ display:none; }

  /* ---------- add-to-cart on item card ---------- */
  .item-actions{ display:flex; align-items:center; justify-content:flex-end; margin-top:10px; }
  .add-cart-btn{
    border:none; border-radius:999px; background:var(--coffee); color:#fff; cursor:pointer;
    font-size:12.5px; font-weight:700; padding:7px 14px; display:flex; align-items:center; gap:5px;
    font-family:'Noto Sans Ethiopic',sans-serif; transition:opacity .15s ease;
  }
  .add-cart-btn:hover{ opacity:0.88; }
  .qty-stepper{ display:flex; align-items:center; gap:10px; background:#FBEFE4; border-radius:999px; padding:4px 6px; }
  .qty-stepper button{
    width:26px; height:26px; border-radius:50%; border:none; cursor:pointer; background:var(--orange);
    color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .qty-stepper span{ min-width:16px; text-align:center; font-weight:700; font-size:13.5px; }

  /* ---------- cart / checkout modal ---------- */
  .cart-line{
    display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:10px 12px;
    margin-bottom:10px; box-shadow:var(--shadow);
  }
  .cart-line .item-icon{ width:38px; height:38px; font-size:18px; }
  .cart-line-body{ flex:1; min-width:0; }
  .cart-line-name{ font-weight:700; font-size:14px; }
  .cart-line-price{ font-size:12px; color:var(--muted); margin-top:2px; }
  .cart-line-remove{
    background:none; border:none; color:#B23A2B; font-size:16px; cursor:pointer; padding:4px; flex-shrink:0;
  }
  .cart-summary{
    display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:15.5px;
    padding:14px 4px 4px; border-top:2px dashed rgba(232,103,43,0.2); margin-top:8px;
  }
  .cart-empty{ text-align:center; color:var(--muted); padding:40px 10px; }
  .cart-empty .emoji{ font-size:36px; display:block; margin-bottom:10px; }
  .order-success{ text-align:center; padding:30px 10px; }
  .order-success .emoji{ font-size:44px; display:block; margin-bottom:12px; }
  .order-success h4{ margin:0 0 6px; font-size:17px; }
  .order-success p{ color:var(--muted); font-size:13.5px; margin:0 0 4px; }
  .order-code-box{
    margin-top:18px; background:#FBF3EC; border:2px dashed rgba(232,103,43,0.3);
    border-radius:14px; padding:16px; text-align:center;
  }
  .order-code-label{ font-size:12px; color:var(--muted); margin-bottom:6px; }
  .order-code-value{
    font-size:26px; font-weight:800; letter-spacing:4px; color:var(--orange-dark);
    font-family:var(--font-mono, monospace); margin-bottom:10px;
  }
  .order-code-hint{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; }

  /* ---------- order type (in house / take away) popup ---------- */
  .order-type-item-preview{
    display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:10px 12px;
    margin-bottom:18px; box-shadow:var(--shadow);
  }
  .order-type-item-preview .item-icon{ width:38px; height:38px; font-size:18px; }
  .order-type-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; padding:15px 18px;
  }
  .order-type-btn + .order-type-btn{ margin-top:10px; }
  .order-type-hint{ text-align:center; color:var(--muted); font-size:12px; margin-top:14px; line-height:1.6; }

  /* ---------- order-type modal: manual table-number step ---------- */
  .table-number-input{
    width:100%; padding:12px 14px; border-radius:12px; border:2px solid rgba(232,103,43,0.2);
    font-size:15px; text-align:center; font-weight:700; letter-spacing:1px; margin-bottom:12px;
    font-family:'Noto Sans Ethiopic',sans-serif; color:var(--ink); background:#fff; outline:none;
  }
  .table-number-input:focus{ border-color:var(--orange); }

  .table-detected-card{
    display:flex; align-items:center; gap:12px; background:#F3FBF4; border:2px solid rgba(46,145,79,0.25);
    border-radius:14px; padding:14px 16px; margin-bottom:16px;
  }
  .table-detected-check{
    flex-shrink:0; width:34px; height:34px; border-radius:50%; background:#2E914F; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .table-detected-num{ font-weight:700; font-size:15px; color:var(--ink); }
  .table-detected-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .table-manual-toggle{
    display:block; width:100%; text-align:center; background:none; border:none; color:var(--muted);
    font-size:12.5px; text-decoration:underline; padding:10px 0 2px; cursor:pointer; font-family:inherit;
  }

  /* ---------- admin: tables / QR codes ---------- */
  .table-card{
    display:flex; align-items:center; gap:14px; background:#fff; border-radius:16px; padding:14px;
    margin-bottom:12px; box-shadow:var(--shadow);
  }
  .table-card-qr{ width:84px; height:84px; border-radius:10px; flex-shrink:0; background:#fff; box-shadow:0 0 0 1px rgba(61,32,21,0.08); }
  .table-card-body{ flex:1; min-width:0; }
  .table-card-label{ font-weight:800; font-size:15px; }
  .table-card-url{ font-size:11px; color:var(--muted); word-break:break-all; margin-top:2px; }
  .table-card-actions{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .table-quick-add{ display:flex; gap:8px; align-items:flex-end; }
  .table-quick-add .field-group{ flex:1; }


  .order-card{
    background:#fff; border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
    border-left:4px solid var(--orange);
  }
  .order-card.is-done{ border-left-color:#8fae7a; opacity:0.72; }
  .order-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .order-card-name{ font-weight:700; font-size:14.5px; }
  .order-card-code{
    font-weight:700; font-size:11px; color:var(--orange-dark); background:#FBF3EC;
    border-radius:6px; padding:1px 6px; letter-spacing:0.5px; margin-left:4px;
  }
  .order-type-badge{
    display:inline-flex; align-items:center; gap:3px; font-weight:700; font-size:10.5px;
    border-radius:6px; padding:2px 7px; letter-spacing:0.2px; margin-left:4px; white-space:nowrap;
  }
  .order-type-badge.dine-in{ background:#E9F0FB; color:#2E5EA6; }
  .order-type-badge.takeaway{ background:#FBF0DD; color:#93611B; }
  .order-card-phone{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .order-card-time{ font-size:11px; color:var(--muted); white-space:nowrap; }
  .order-card-items{ font-size:12.5px; margin:10px 0; color:var(--ink); line-height:1.6; }
  .order-status-pill{
    font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase;
    letter-spacing:0.5px; background:#FBE3DD; color:#B23A2B;
  }
  .order-status-pill.done{ background:#E7F0DF; color:#4E6B3A; }
  .order-card-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .order-card-total{ font-weight:700; font-size:14px; color:var(--orange-dark); }
  .order-card-actions{ display:flex; gap:6px; }

  .order-card.is-bundle{ border-left-color:#2E5EA6; }
  .order-card.is-bundle.is-done{ border-left-color:#8fae7a; }
  .order-bundle-count{
    font-weight:700; font-size:11px; color:#2E5EA6; background:#E9F0FB;
    border-radius:6px; padding:1px 6px; letter-spacing:0.2px; margin-left:4px; white-space:nowrap;
  }
  .order-bundle-codes{ font-size:11px; color:var(--muted); margin-top:2px; }

  /* ---------- hamburger sidebar drawer ---------- */
  .sidebar-overlay{
    position:fixed; inset:0; background:rgba(61,32,21,0.55); z-index:50;
    animation:fadeIn .18s ease both;
  }
  .sidebar-panel{
    position:fixed; top:0; left:0; bottom:0; width:84%; max-width:340px;
    background:var(--cream); box-shadow:10px 0 34px rgba(61,32,21,0.35);
    overflow-y:auto; display:flex; flex-direction:column;
    animation:slideInLeft .24s cubic-bezier(.32,.72,.28,1) both;
  }
  @keyframes slideInLeft{ from{ transform:translateX(-100%); } to{ transform:translateX(0); } }
  .sidebar-head{
    position:sticky; top:0; background:var(--coffee); color:#fff; padding:18px 20px;
    display:flex; align-items:center; justify-content:space-between; z-index:2; flex-shrink:0;
  }
  .sidebar-head h3{ margin:0; font-size:17px; font-weight:700; }
  .sidebar-body{ padding:20px; flex:1; }

  /* ---------- fullscreen image lightbox ---------- */
  .img-lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(20,10,6,0.92);
    display:flex; align-items:center; justify-content:center;
    padding:24px; cursor:zoom-out; animation:fadeIn .15s ease both;
  }
  .img-lightbox img{
    max-width:100%; max-height:100%; object-fit:contain;
    border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.5);
    animation:lightboxZoomIn .18s cubic-bezier(.32,.72,.28,1) both;
  }
  @keyframes lightboxZoomIn{ from{ transform:scale(0.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .img-lightbox-close{
    position:fixed; top:16px; right:16px; width:40px; height:40px; border-radius:50%;

<script>
/* ============================ DATA ============================ */
// The menu itself lives in the Python backend (SQLite via Flask, see app.py).
// This page talks to it through two endpoints:
//   GET  /api/menu           -> public, returns { categories, items }
//   POST /api/menu           -> admin only, requires header X-Admin-Pin
//   POST /api/admin/verify   -> checks a PIN, used for the login screen

function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let state = null;
let activeCategory = null;
let isAuthenticated = false;
let adminModeActive = false;
let adminTab = 'categories';
let adminPin = '';   // kept only in memory for this browser session, never stored

/* ---- brand color: theming only, every gradient/shadow/pattern in the CSS keeps
   referencing the same --orange/--orange-dark/--orange-light variables, so picking
   a new color re-tints the existing design instead of changing its layout/texture ---- */
const DEFAULT_BRAND_COLOR = '#E8672B';

/* ---- title (brand name) font options ----
   Each stack keeps an Ethiopic-capable fallback so Amharic characters still
   render properly even when the chosen display font is Latin-only. ---- */
const TITLE_FONT_OPTIONS = {
  serif_ethiopic:  { label: 'ነባሪ / Default (Noto Serif Ethiopic)', stack: "'Noto Serif Ethiopic','Noto Sans Ethiopic',serif" },
  sans_ethiopic:   { label: 'Noto Sans Ethiopic',                   stack: "'Noto Sans Ethiopic',sans-serif" },
  abyssinica:      { label: 'Abyssinica SIL',                       stack: "'Abyssinica SIL','Noto Sans Ethiopic',serif" },
  playfair:        { label: 'Playfair Display',                     stack: "'Playfair Display','Noto Sans Ethiopic',serif" },
  poppins:         { label: 'Poppins',                               stack: "'Poppins','Noto Sans Ethiopic',sans-serif" },
  montserrat:      { label: 'Montserrat',                            stack: "'Montserrat','Noto Sans Ethiopic',sans-serif" },
  pacifico:        { label: 'Pacifico (script)',                     stack: "'Pacifico','Noto Sans Ethiopic',cursive" },
  anta:            { label: 'Anta',                                  stack: "'Anta','Noto Sans Ethiopic',sans-serif" },
};

function hexToRgb(hex){
  let h = String(hex||'').replace('#','');
  if(h.length === 3) h = h.split('').map(c=>c+c).join('');
  const num = parseInt(h, 16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  const c = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0');
  return `#${c(r)}${c(g)}${c(b)}`;
}
// Shifts a hex color toward black (negative percent) or white (positive percent),
// used to derive the existing --orange-dark / --orange-light gradient stops from
// whatever base color the admin picks.
function shadeHex(hex, percent){
  const { r, g, b } = hexToRgb(hex);
  const target = percent < 0 ? 0 : 255;
  const p = Math.abs(percent);
  return rgbToHex(r + (target - r) * p, g + (target - g) * p, b + (target - b) * p);
}
function isValidHexColor(hex){
  return /^#[0-9a-fA-F]{6}$/.test(String(hex || ''));
}
// Applies the brand color to the same CSS variables the whole app's gradients,
// buttons, and highlights already reference — no other CSS changes, so every
// existing shape/gradient/shadow ("texture") is preserved, just re-tinted.
function applyBrandColor(hex){
  const color = isValidHexColor(hex) ? hex : DEFAULT_BRAND_COLOR;
  const root = document.documentElement.style;
  root.setProperty('--orange', color);
  root.setProperty('--orange-dark', shadeHex(color, -0.18));
  root.setProperty('--orange-light', shadeHex(color, 0.22));
}

function applyTitleFont(key){
  const opt = TITLE_FONT_OPTIONS[key] || TITLE_FONT_OPTIONS.serif_ethiopic;
  document.documentElement.style.setProperty('--brand-title-font', opt.stack);
}

/* ---- new-order push notification (admin mode only) ---- */
let ordersPollTimer = null;
let knownOrderIds = new Set();
let ordersBaselineReady = false;   // true once we've seen the first snapshot, so we
                                    // don't "notify" about every order that already existed
let unseenOrdersCount = 0;         // live badge count on the Orders tab
const ORDERS_POLL_MS = 15000;

/* ============================ BACK BUTTON / HISTORY NAV ============================
   The app is a single page, so by default the phone/browser back button just leaves
   the site the moment any modal, panel, or the admin view is open — surprising on
   mobile, where people expect back to close whatever's on screen first.

   Every "screen" the app can show (cart, checkout, the hamburger menu, order status,
   the admin PIN prompt, the admin panel itself, the image lightbox) pushes an entry
   onto navStack when it opens. Each entry knows how to re-show itself (render) and
   how to tear itself down (close) — nothing more. Closing a screen from inside the
   UI (✕ buttons, tapping the overlay, "Back to cart", "Exit", etc.) never touches
   the DOM directly; it calls history.back() (via navClose), and the single popstate
   handler below is the only place that actually pops entries and runs their close().
   That keeps our stack and the browser's history entry always in sync, from either
   direction (UI or the physical/gesture back button).

   `root` tags which shared container an entry draws into (cartModalRoot / modalRoot /
   adminView / lightboxRoot). After popping some entries, we only re-render whatever's
   now on top if one of the popped entries drew into the *same* container — e.g.
   closing the checkout screen (cartModalRoot) needs the cart screen underneath
   (also cartModalRoot) redrawn, but closing the image lightbox (its own container)
   never needs to touch a checkout form sitting underneath it, so its typed-in name
   and phone survive. */
let navStack = [];

function navOpen(screen, root, render, close, meta){
  render();
  navStack.push({ screen, root, render, close, meta: meta || {} });
  history.pushState({ navIndex: navStack.length }, '', location.pathname + location.search);
}

// Swaps the currently-open screen for a different one at the SAME depth (no new
// back-step needed) — e.g. the hamburger menu turning into the admin PIN prompt.
function navReplaceTop(render, close, root){
  render();
  if(navStack.length > 0){
    const top = navStack[navStack.length - 1];
    top.render = render;
    top.close = close;
    if(root) top.root = root;
  }
}

// Ask the browser to go back one step; the popstate handler does the actual teardown.
function navClose(){
  if(navStack.length > 0) history.back();
}

// Fully exits every open screen (e.g. hamburger menu open on top of the admin
// panel) in a single back-step, instead of requiring one press per layer.
function navGoHome(){
  if(navStack.length > 0) history.go(-navStack.length);
}

window.addEventListener('popstate', function(event){
  const targetIndex = (event.state && typeof event.state.navIndex === 'number') ? event.state.navIndex : 0;
  const poppedRoots = new Set();
  while(navStack.length > targetIndex){
    const top = navStack.pop();
    poppedRoots.add(top.root);
    try{ top.close(); }catch(e){ console.error('Nav close error', e); }
  }
  const now = navStack[navStack.length - 1];
  if(now && poppedRoots.has(now.root)){
    try{ now.render(); }catch(e){ console.error('Nav render error', e); }
  }
});

/* ============================ STORAGE (Flask API) ============================ */
async function loadData(){
  try{
    const res = await fetch('/api/menu');
    if(!res.ok) throw new Error('GET /api/menu failed: ' + res.status);
    state = await res.json();
  }catch(e){
    console.error('Load error', e);
    state = { categories: [], items: [], payment: {} };
    showToast('⚠️ Could not reach the server / ሰርቨሩ ላይ መድረስ አልተቻለም');
  }
  if(!state.payment) state.payment = {};
  if(!state.brand) state.brand = {};
  if(!state.tables) state.tables = [];
  activeCategory = state.categories[0] ? state.categories[0].id : null;
  syncLogoCache();
}

// Caches the current logo (profile picture) in localStorage so the very
// first "Loading menu..." splash — shown before anything has been fetched —
// can already spin the logo instead of the default cup icon, on repeat
// visits from this browser once one has been set.
function syncLogoCache(){
  try{
    const logo = state.brand && state.brand.profileImage;
    if(logo) localStorage.setItem('sabaCoffeeLogo', logo);
    else localStorage.removeItem('sabaCoffeeLogo');
  }catch(e){}
}

async function saveData(showToastMsg){
  try{
    const res = await fetch('/api/menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': adminPin },
      body: JSON.stringify(state)
    });
    if(res.status === 401){
      isAuthenticated = false;
      if(showToastMsg !== false){ showToast('ፒን ትክክል አይደለም / Not authorized — please log in again'); }
      renderAdminModal();
      return false;
    }
    if(!res.ok) throw new Error('POST /api/menu failed: ' + res.status);
    if(showToastMsg !== false){ showToast('ተቀምጧል ✓ Saved'); }
    return true;
  }catch(e){
    console.error('Save error', e);
    if(showToastMsg !== false){ showToast('ማስቀመጥ አልተሳካም / Save failed'); }

/* ---- category chip strip: native swipe/scroll (touch swipe, trackpad, mouse
   wheel) in addition to tapping a chip — no drag/press needed ---- */
function updateCatNavScrollUI(){
  const nav = document.getElementById('catNav');
  if(!nav) return;
  const max = nav.scrollWidth - nav.clientWidth;
  const atStart = nav.scrollLeft <= 4;
  const atEnd = nav.scrollLeft >= max - 4;
  const canScroll = max > 4;
  document.getElementById('catNavFadeLeft').classList.toggle('show', canScroll && !atStart);
  document.getElementById('catNavFadeRight').classList.toggle('show', canScroll && !atEnd);
}

function initCatNavScroll(){
  const nav = document.getElementById('catNav');
  if(!nav) return;

  nav.addEventListener('scroll', updateCatNavScrollUI, { passive:true });
  window.addEventListener('resize', updateCatNavScrollUI);

  // Vertical mouse-wheel / trackpad scroll moves the strip horizontally,
  // so a normal scroll gesture browses categories without needing to hold shift.
  nav.addEventListener('wheel', (e)=>{
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // already horizontal, let it be
    e.preventDefault();
    nav.scrollLeft += e.deltaY;
  }, { passive:false });
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Renders the contents of a `.item-icon` circle: an uploaded picture if the
// item has one, otherwise the old emoji icon (kept for items created before
// this feature), otherwise a default plate emoji.
function itemIconHtml(item, previewable){
  if(item && item.image){

    return `<img src="${item.image}" alt="${escapeHtml(item.name||'')}"${click}>`;
  }
  return escapeHtml((item && item.icon) || '🍽️');
}

function renderItemCartControl(itemId){

function addToCart(itemId){

/* ---------- order type: "In house" or "Take away" ----------
   A table's QR code just opens the normal storefront — scanning it doesn't
   change how browsing or "Add" behaves. The only thing it does is quietly
   remember which table was scanned (activeTableLabel) for the rest of the
   visit, in case the customer later chooses "In house":
     Take away -> completely conventional: goes into the persistent cart,
                  checkout later through the normal cart/checkout form,
                  table info is never sent or asked for.
     In house  -> if a table was scanned, it's auto-detected and the order
                  goes straight to the kitchen with one confirm tap — no
                  typing. If no table was scanned (or the customer says the
                  detected one is wrong), falls back to a manual number
                  field, still skipping the cart/checkout form. */
let activeTableLabel = null;
const orderTypeModalRoot = () => document.getElementById('modalRoot');
let pendingOrderTypeItemId = null;

// Reads ?table=... from the URL (set by a table's QR code), remembers it in
// sessionStorage for the rest of the visit, and strips it back out of the
// address bar so the site just looks like its normal main page. Returns the
// "clean" location.search to install afterwards.
function initTableContext(){
  let cleanSearch = location.search;
  try{
    const params = new URLSearchParams(location.search);
    const fromUrl = (params.get('table') || '').trim();
    if(fromUrl){
      activeTableLabel = fromUrl.slice(0, 60);
      sessionStorage.setItem('sabaActiveTable', activeTableLabel);
      params.delete('table');
      const rest = params.toString();
      cleanSearch = rest ? ('?' + rest) : '';
    } else {
      const fromSession = sessionStorage.getItem('sabaActiveTable');
      if(fromSession) activeTableLabel = fromSession;
    }
  }catch(e){
    console.error('Table context error', e);
  }
  return cleanSearch;
}

            </div>

          </div>
          <div class="modal-body">
            <div class="order-type-item-preview">

            <button type="button" class="table-manual-toggle" onclick="renderTableNumberStep('${itemId}', true)">ይህ ትክክል አይደለም? በእጅ ያስገቡ / Not your table? Enter manually</button>

          </div>

            <div>
              <div class="cart-line-name">${escapeHtml(item.name)}</div>
              <div class="cart-line-price">${Number(item.price).toLocaleString()} ብር</div>
            </div>
          </div>
          <label class="field-label">በአሁኑ ጠረጴዛዎ ላይ ያለውን ቁጥር ያስገቡ / Enter the number on your table</label>
          <input type="text" class="table-number-input" id="manualTableInput" placeholder="e.g. 5" autocomplete="off" value="">

          <button class="btn btn-primary btn-block order-type-btn" id="dineInConfirmBtn" onclick="confirmDineInWithTable('${itemId}')">✅ ትዕዛዝ ላክ / Send order</button>
          ${detected ? `<button type="button" class="table-manual-toggle" onclick="renderTableNumberStep('${itemId}')">🔍 ጠረጴዛ ${escapeHtml(detected)} ተገኝቷል — ይህን ተጠቀም / Table ${escapeHtml(detected)} detected — use it instead</button>` : ''}

async function confirmDetectedTable(itemId){
  const item = state.items.find(i=>i.id===itemId);
  if(!item) return;
  await submitDineInOrder(item, activeTableLabel || '', document.getElementById('dineInConfirmBtn'));
}
window.confirmDetectedTable = confirmDetectedTable;

async function confirmDineInWithTable(itemId){
  const item = state.items.find(i=>i.id===itemId);
  const inp = document.getElementById('manualTableInput');
  const errEl = document.getElementById('tableNumberError');
  if(!item || !inp) return;
  const label = inp.value.trim();
  if(!label){ errEl.textContent = 'እባክዎ የጠረጴዛ ቁጥር ያስገቡ / Please enter a table number'; inp.focus(); return; }
  errEl.textContent = '';
  await submitDineInOrder(item, label, document.getElementById('dineInConfirmBtn'));
}
window.confirmDineInWithTable = confirmDineInWithTable;

async function submitDineInOrder(item, tableLabel, btnEl){
  const takeawayBtn = document.getElementById('takeawayBtn');
  if(takeawayBtn) takeawayBtn.disabled = true;
  const t0 = performance.now();
  if(btnEl) setBtnLoading(btnEl, 'በማዘዝ ላይ... / Placing order...');

  try{
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        orderType: 'dine_in',
        tableLabel: tableLabel || undefined,
        items: [{ id: item.id, name: item.name, nameEn: item.nameEn || '', price: item.price, qty: 1 }],
        total: Number(item.price) || 0
      })
    });
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      throw new Error(data.error || ('POST /api/orders failed: ' + res.status));
    }
    const data = await res.json();
    const ms = btnEl ? clearBtnLoading(btnEl) : Math.round(performance.now() - t0);
    showToast(`ትዕዛዝ ተልኳል ✓ Order sent (${fmtMs(ms)})`);
    navReplaceTop(()=>renderDineInOrderSuccess(item, data.orderCode, tableLabel), closeOrderTypeModal, 'modalRoot');
  }catch(e){
    const ms = btnEl ? clearBtnLoading(btnEl) : Math.round(performance.now() - t0);
    console.error('Dine-in order error', e);
    showToast(`ትዕዛዝ መላክ አልተሳካም / Could not place order (${fmtMs(ms)}) — please try again`);
    if(takeawayBtn) takeawayBtn.disabled = false;
  }
}

          <h3>ትዕዛዝ ተልኳል / Order sent</h3>

        </div>
        <div class="modal-body">
          <div class="order-success">
            <span class="emoji">✅</span>
            <h4>${escapeHtml(item.name)}</h4>
            <p>ትዕዛዝዎ ወደ ወጥ ቤት ተልኳል${tableLabel ? ` (ጠረጴዛ ${escapeHtml(tableLabel)})` : ''}፣ በቅርቡ ይደርስዎታል።</p>

            <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="navClose()">ተጨማሪ ይዘዙ / Order more</button>
          </div>
        </div>
      </div>
    </div>`;
}

function changeQty(itemId, delta){
  const next = (cart[itemId] || 0) + delta;
  if(next <= 0){ delete cart[itemId]; } else { cart[itemId] = next; }
  renderMenu();
  renderCartFab();
  if(document.getElementById('cartModalRoot').innerHTML.trim() !== ''){
    renderCartModal();
  }
}
window.changeQty = changeQty;

function cartEntries(){
  return Object.keys(cart).map(id=>{
    const item = state.items.find(i=>i.id===id);
    if(!item) return null;
    return { item, qty: cart[id] };
  }).filter(Boolean);
}

function cartCount(){
  return Object.values(cart).reduce((sum,q)=>sum+q, 0);
}

function cartTotal(){
  return cartEntries().reduce((sum,e)=> sum + (Number(e.item.price)||0) * e.qty, 0);
}

function renderCartFab(){
  const fab = document.getElementById('cartFab');
  const badge = document.getElementById('cartBadge');
  const totalEl = document.getElementById('cartFabTotal');
  const count = cartCount();
  if(count === 0){
    fab.classList.add('is-empty');
    badge.style.display = 'none';
    totalEl.textContent = '';
    return;
  }
  fab.classList.remove('is-empty');
  badge.style.display = 'flex';
  badge.textContent = count;
  totalEl.textContent = cartTotal().toLocaleString() + ' ብር';
}

const cartModalRoot = document.getElementById('cartModalRoot');

function openCart(){
  navOpen('cart', 'cartModalRoot', renderCartModal, closeCart);
}
document.getElementById('cartFab').addEventListener('click', openCart);

function closeCart(){
  cartModalRoot.innerHTML = '';
}
window.closeCart = closeCart;

function renderCartModal(){
  const entries = cartEntries();

  if(entries.length === 0){
    cartModalRoot.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) navClose()">
        <div class="modal">
          <div class="modal-head">
            <h3>ጋሪዎ / Your cart</h3>

// Loading spinner: once the admin has set a profile picture / logo, every
// loading indicator in the app spins that picture instead of the default
// coffee-cup animation.
// size: 'sm' (buttons), 'md' (inline blocks), 'lg' (full-screen loader).
function spinnerCup(size, dark){
  const logo = state && state.brand && state.brand.profileImage;
  if(logo){
    return `<img class="spinner-logo ${size}" src="${logo}" alt="" aria-hidden="true">`;
  }
  const cls = `spinner-cup ${size}${dark ? ' spinner-dark' : ''}`;
  return `<svg class="${cls}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path class="steam s1" d="M8 3c0 1-1.2 1-1.2 2s1.2 1 1.2 2"/>
    <path class="steam s2" d="M12 3c0 1-1.2 1-1.2 2s1.2 1 1.2 2"/>
    <path class="steam s3" d="M16 3c0 1-1.2 1-1.2 2s1.2 1 1.2 2"/>
    <path class="cup-outline" d="M4 10h13v5.5A4.5 4.5 0 0 1 12.5 20h-4A4.5 4.5 0 0 1 4 15.5V10z"/>
    <path class="cup-outline" d="M17 11.5h1.2a2.3 2.3 0 0 1 0 4.6H17"/>
  </svg>`;
}

// Small reusable helper: puts a button into a disabled "spinning" state and
// remembers its original label so it can be restored afterwards.
function setBtnLoading(btnEl, loadingLabel){
  if(!btnEl) return;
  if(btnEl.dataset.origLabel === undefined) btnEl.dataset.origLabel = btnEl.innerHTML;
  btnEl.dataset.loadStart = String(performance.now());
  btnEl.disabled = true;
  btnEl.innerHTML = `${spinnerCup('sm')}${loadingLabel}`;
}
// Restores the button to its pre-loading label and returns how long it spent
// in the loading state (ms) so callers can surface the response time.
function clearBtnLoading(btnEl){
  if(!btnEl) return 0;
  btnEl.disabled = false;
  const start = Number(btnEl.dataset.loadStart || 0);
  const ms = start ? Math.round(performance.now() - start) : 0;
  if(btnEl.dataset.origLabel !== undefined){
    btnEl.innerHTML = btnEl.dataset.origLabel;
    delete btnEl.dataset.origLabel;
  }
  delete btnEl.dataset.loadStart;
  return ms;
}
// Formats a millisecond duration for display next to a result, e.g. "312ms" / "1.4s"
function fmtMs(ms){
  if(!Number.isFinite(ms) || ms < 0) ms = 0;
  return ms < 1000 ? `${ms}ms` : `${(ms/1000).toFixed(1)}s`;
}

function handleProfileImageChange(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  if(!file.type.startsWith('image/')){
    alert('እባክዎ የምስል ፋይል ይምረጡ / Please choose an image file');
    event.target.value = '';
    return;
  }
  if(file.size > 6 * 1024 * 1024){
    alert('ፋይሉ በጣም ትልቅ ነው (ከ6MB በታች መሆን አለበት) / File is too large (max 6MB)');
    event.target.value = '';

  const reader = new FileReader();

async function submitOrder(event){
  const nameEl = document.getElementById('orderName');
  const phoneEl = document.getElementById('orderPhone');
  const errEl = document.getElementById('orderError');
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();

  if(!name){ errEl.textContent = 'እባክዎ ስም ያስገቡ / Please enter your name'; nameEl.focus(); return; }
  if(!phone){ errEl.textContent = 'እባክዎ ስልክ ቁጥር ያስገቡ / Please enter a phone number'; phoneEl.focus(); return; }

  const entries = cartEntries();
  const items = entries.map(e=>({
    id: e.item.id, name: e.item.name, nameEn: e.item.nameEn || '', price: e.item.price, qty: e.qty
  }));
  const total = cartTotal();

  errEl.textContent = '';
  const submitBtn = event && event.currentTarget ? event.currentTarget : document.querySelector('[onclick^="submitOrder("]');
  setBtnLoading(submitBtn, 'በመላክ ላይ... / Submitting...');
  let orderResult = null;
  try{
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, items, total, paymentScreenshot: paymentScreenshotData || undefined })
    });
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      throw new Error(data.error || ('POST /api/orders failed: ' + res.status));
    }
    orderResult = await res.json();
    cart = {};
    paymentScreenshotData = null;
    renderMenu();
    renderCartFab();
  }catch(e){
    console.error('Order submit error', e);
    errEl.textContent = 'ትዕዛዝ መላክ አልተሳካም / Could not submit order — please try again';
  }finally{
    const ms = clearBtnLoading(submitBtn);
    if(orderResult){
      showToast(`ትዕዛዝ ተልኳል ✓ Order sent (${fmtMs(ms)})`);
      navReplaceTop(()=>renderOrderSuccess(name, orderResult.orderCode), closeCart, 'cartModalRoot');
    } else if(errEl.textContent){
      errEl.textContent += ` (${fmtMs(ms)})`;
    }
  }
}

   source of truth for which "page" is showing. Anywhere else in this file
   you can gate a feature with:
       if (adminModeActive) { ... admin-only behavior ... }
       else                 { ... customer-only behavior ... }
   setAppMode() is the only place that flips it, via the switch in the
   hamburger menu. */

    const res = await fetch('/api/orders/status/' + encodeURIComponent(val));
    const data = await res.json().catch(()=>null);
    const ms = clearBtnLoading(checkBtn);
    if(!res.ok){
      renderOrderStatusModal(null, val, `${(data && data.error) || 'ትዕዛዝ ማረጋገጥ አልተሳካም / Could not check status'} (${fmtMs(ms)})`);
      return;
    }
    showToast(`ተገኝቷል ✓ Found (${fmtMs(ms)})`);
    renderOrderStatusModal(data, val);
  }catch(e){
    const ms = clearBtnLoading(checkBtn);
    console.error('Order status check failed', e);
    renderOrderStatusModal(null, val, `ሰርቨሩ ላይ መድረስ አልተቻለም / Could not reach server (${fmtMs(ms)})`);

async function checkPin(){
  const val = document.getElementById('pinInput').value;
  const errEl = document.getElementById('pinError');
  errEl.textContent = '';
  const btn = document.querySelector('[onclick^="checkPin("]');
  setBtnLoading(btn, 'በመግባት ላይ... / Logging in...');
  try{
    const res = await fetch('/api/admin/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: val })
    });
    const data = await res.json();
    const ms = clearBtnLoading(btn);
    if(data && data.ok){
      adminPin = val;
      isAuthenticated = true;
      showToast(`ገብተዋል ✓ Logged in (${fmtMs(ms)})`);
      if(adminModeActive){
        // Re-auth prompt shown on top of an already-open admin panel — just
        // dismiss it, the panel underneath never went anywhere.
        closeAdmin();
      } else {
        // Fresh login: swap this same nav entry (the PIN screen) into the
        // full admin panel, so a single back-step later exits it entirely.
        navReplaceTop(enterAdminModeNav, exitAdminModeNav, 'adminView');
      }
    } else {
      errEl.textContent = `ትክክል ያልሆነ ፒን / Incorrect PIN (${fmtMs(ms)})`;
    }
  }catch(e){
    const ms = clearBtnLoading(btn);
    console.error('PIN check error', e);
    errEl.textContent = `ሰርቨሩ ላይ መድረስ አልተቻለም / Could not reach server (${fmtMs(ms)})`;
  }
}

// Builds the URL a table's QR code should point at: the site itself with
// ?table=<label> attached, so opening it auto-tags every dine-in order the
// customer places with that table's label (no popup needed at that point).
function tableOrderUrl(label){
  const base = location.origin + location.pathname;
  return base + '?table=' + encodeURIComponent(label);
}

// Free public QR-image API (goqr.me) — renders straight to a downloadable/
// printable PNG with no extra JS library needed.
function tableQrImageUrl(label, size){
  size = size || 300;
  return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size
    + '&data=' + encodeURIComponent(tableOrderUrl(label));
}

function tableLabelExists(label){
  const norm = label.trim().toLowerCase();
  return (state.tables || []).some(t => t.label.trim().toLowerCase() === norm);
}

async function addTable(){
  const input = document.getElementById('newTableLabel');
  const label = (input.value || '').trim();
  if(!label){ showToast('እባክዎ የጠረጴዛ ስም ያስገቡ / Please enter a table label'); return; }
  if(label.length > 60){ showToast('ስሙ በጣም ረጅም ነው / Label is too long'); return; }
  if(tableLabelExists(label)){ showToast('ይህ ጠረጴዛ አስቀድሞ አለ / That table already exists'); return; }
  if(!state.tables) state.tables = [];
  state.tables.push({ id: uid('table'), label });
  const btn = document.querySelector('[onclick^="addTable("]');
  if(btn) setBtnLoading(btn, 'በማስቀመጥ ላይ… / Saving…');
  const ok = await saveData(false);
  const ms = btn ? clearBtnLoading(btn) : 0;
  showToast(ok ? `ጠረጴዛ ታክሏል ✓ Table added (${fmtMs(ms)})` : `ማስቀመጥ አልተሳካም / Save failed (${fmtMs(ms)})`);
  renderAdminContent();
}
window.addTable = addTable;

async function quickAddTables(){
  const from = parseInt(document.getElementById('quickTableFrom').value, 10);
  const to = parseInt(document.getElementById('quickTableTo').value, 10);
  if(!Number.isFinite(from) || !Number.isFinite(to) || from < 1 || to < from){
    showToast('እባክዎ ትክክለኛ ክልል ያስገቡ / Please enter a valid range');
    return;
  }
  if(to - from > 200){
    showToast('በአንድ ጊዜ እስከ 200 ጠረጴዛዎች ብቻ / Up to 200 tables at a time');
    return;
  }
  if(!state.tables) state.tables = [];
  let added = 0;
  for(let n = from; n <= to; n++){
    const label = String(n);
    if(!tableLabelExists(label)){
      state.tables.push({ id: uid('table'), label });
      added++;
    }
  }
  if(added === 0){ showToast('እነዚህ ጠረጴዛዎች አስቀድሞ አሉ / Those tables already exist'); return; }
  const btn = document.querySelector('[onclick^="quickAddTables("]');
  if(btn) setBtnLoading(btn, 'በማስቀመጥ ላይ… / Saving…');
  const ok = await saveData(false);
  const ms = btn ? clearBtnLoading(btn) : 0;
  showToast(ok ? `${added} ጠረጴዛዎች ታክለዋል ✓ ${added} tables added (${fmtMs(ms)})` : `ማስቀመጥ አልተሳካም / Save failed (${fmtMs(ms)})`);
  renderAdminContent();
}

// Holds the uploaded picture (as a data URL) for the "Add new item" form
// while the user is still filling it in — the item doesn't exist yet, so it
// can't be attached to a real item until addItem() runs.
let newItemImageData = null;

function handleItemImageChange(event, itemId){
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  if(!file.type.startsWith('image/')){
    alert('እባክዎ የምስል ፋይል ይምረጡ / Please choose an image file');
    event.target.value = '';
    return;
  }
  if(file.size > 6 * 1024 * 1024){
    alert('ፋይሉ በጣም ትልቅ ነው (ከ6MB በታች መሆን አለበት) / File is too large (max 6MB)');
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    updateItem(itemId, 'image', reader.result);
  };
  reader.onerror = () => {
    alert('ስዕሉን መጫን አልተቻለም / Could not read the image');
  };
  reader.readAsDataURL(file);
}
window.handleItemImageChange = handleItemImageChange;

function formatOrderTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso || ''; }

/* ---- new-order push notification (admin mode only) ----
   Polls /api/orders every few seconds while adminModeActive is true, no
   matter which admin tab is open. Any order id we haven't seen before
   (after the first snapshot) triggers a sound + a browser notification. */

function playOrderChime(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    // two quick ascending notes, so it reads as "new order" rather than an error beep
    [[880, 0], [1175, 0.14]].forEach(([freq, delay])=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.22, now + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.32);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.34);
    });
    setTimeout(()=>ctx.close(), 900);
  }catch(e){ console.warn('Chime failed', e); }
}

function notifyNewOrders(newOrders){
  playOrderChime();

  const count = newOrders.length;
  const title = count === 1 ? '🛎️ አዲስ ትዕዛዝ / New order' : `🛎️ ${count} አዲስ ትዕዛዞች / ${count} new orders`;
  const first = newOrders[0];
  const body = count === 1
    ? `${first.name} — ${Number(first.total).toLocaleString()} ብር`
    : newOrders.slice(0,3).map(o=>o.name).join(', ') + (count > 3 ? '…' : '');

  if('Notification' in window && Notification.permission === 'granted'){
    try{
      const n = new Notification(title, { body, icon: '☕', tag: 'saba-new-order-' + Date.now() });
      n.onclick = ()=>{ window.focus(); if(adminModeActive) switchAdminTab('orders'); };
    }catch(e){ console.warn('Notification failed', e); }
  }

  showToast(title);

  // Flash the tab title until the admin looks back at the page.
  if(document.hidden){
    const original = document.title;
    let flashOn = true;
    document.title = title;
    const flashTimer = setInterval(()=>{
      document.title = flashOn ? title : original;
      flashOn = !flashOn;
    }, 1200);
    const stopFlash = ()=>{
      clearInterval(flashTimer);
      document.title = original;
      document.removeEventListener('visibilitychange', onVisible);
    };
    const onVisible = ()=>{ if(!document.hidden) stopFlash(); };
    document.addEventListener('visibilitychange', onVisible);
  }
}

function updateOrdersTabBadge(){
  const el = document.getElementById('ordersTabBadge');
  if(!el) return; // tab bar not on screen right now, template will pick up the count on next render
  if(unseenOrdersCount > 0){
    el.textContent = unseenOrdersCount > 99 ? '99+' : String(unseenOrdersCount);
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

async function pollOrdersForNew(){
  if(!adminModeActive) return;
  try{
    const res = await fetch('/api/orders', { headers: { 'X-Admin-Pin': adminPin } });
    if(res.status === 401){ console.warn('Order poll: 401 — stale admin pin, badge will stay silent until re-login'); return; }
    if(!res.ok){ console.warn('Order poll: unexpected status', res.status); return; }
    const orders = await res.json();

    if(!ordersBaselineReady){
      orders.forEach(o=>knownOrderIds.add(o.id));
      ordersBaselineReady = true;
      return;
    }

    const fresh = orders.filter(o=>!knownOrderIds.has(o.id));
    if(fresh.length){
      fresh.forEach(o=>knownOrderIds.add(o.id));
      notifyNewOrders(fresh);
      if(adminTab === 'orders'){
        renderOrdersList(orders); // already looking at it — refresh the list instead of badging it
      } else {
        unseenOrdersCount += fresh.length;
        updateOrdersTabBadge();
      }
    }
  }catch(e){
    console.warn('Order poll failed', e);
  }
}

// Browsers throttle (or fully pause) background setInterval timers once a
// tab is hidden/backgrounded — very common on phones when the screen locks
// or the admin switches apps. Without this, the 15s poll can silently stop
// ticking and the badge looks "broken" until the tab is reloaded. Firing an
// immediate poll the moment the tab is visible/focused again closes that gap.
function onOrdersWatcherFocus(){
  if(!adminModeActive) return;
  pollOrdersForNew();
}

function startOrdersWatcher(){
  stopOrdersWatcher();
  ordersBaselineReady = false;
  knownOrderIds = new Set();
  unseenOrdersCount = 0;
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
  pollOrdersForNew(); // establishes the baseline immediately
  ordersPollTimer = setInterval(pollOrdersForNew, ORDERS_POLL_MS);
  document.addEventListener('visibilitychange', onOrdersWatcherFocus);
  window.addEventListener('focus', onOrdersWatcherFocus);
}

function stopOrdersWatcher(){
  if(ordersPollTimer){ clearInterval(ordersPollTimer); ordersPollTimer = null; }
  ordersBaselineReady = false;
  knownOrderIds = new Set();
  unseenOrdersCount = 0;
  document.removeEventListener('visibilitychange', onOrdersWatcherFocus);
  window.removeEventListener('focus', onOrdersWatcherFocus);
}

async function loadOrders(){
  try{
    const res = await fetch('/api/orders', { headers: { 'X-Admin-Pin': adminPin } });
    if(res.status === 401){
      isAuthenticated = false;
      showToast('ፒን ትክክል አይደለም / Not authorized — please log in again');
      renderAdminModal();
      return;
    }
    if(!res.ok) throw new Error('GET /api/orders failed: ' + res.status);
    const orders = await res.json();
    renderOrdersList(orders);
  }catch(e){
    console.error('Load orders error', e);
    const el = document.getElementById('adminContent');
    if(el) el.innerHTML = `<div class="empty-admin-hint">⚠️ ትዕዛዞችን መጫን አልተቻለም / Could not load orders</div>`;
  }
}

// Groups orders for display: active (not-yet-done) dine-in orders that
// share a table are bundled into one entry, since a table usually adds
// items one at a time and staff want to see everything for that table at
// once. Everything else (takeaway orders, dine-in orders with no table,
// and anything already marked done) stays as its own individual entry, so
// history/audit view still shows every order separately.
function groupOrdersForDisplay(orders){
  const result = [];
  const bundleByTable = new Map();

  orders.forEach(o=>{
    const bundleable = o.orderType === 'dine_in' && o.status !== 'done' && o.tableLabel;
    if(bundleable){
      const existing = bundleByTable.get(o.tableLabel);
      if(existing){
        existing.orders.push(o);
        return;
      }
      const bundle = { type:'bundle', tableLabel:o.tableLabel, orders:[o] };
      bundleByTable.set(o.tableLabel, bundle);
      result.push(bundle);
    } else {
      result.push({ type:'single', order:o });
    }
  });

  return result;
}

// Combines items across every order in a table bundle, merging identical
// items (same name + price) into a single line with a summed quantity.
function mergeBundleItems(orders){
  const map = new Map();
  orders.forEach(o=>{
    (o.items || []).forEach(it=>{
      const key = it.name + '|' + it.price;
      const existing = map.get(key);
      if(existing) existing.qty += (it.qty || 1);
      else map.set(key, { name: it.name, price: it.price, qty: it.qty || 1 });
    });
  });
  return Array.from(map.values());
}

async function setOrdersStatusBulk(orderIds, status, event){
  const btn = event && event.currentTarget;
  if(btn) setBtnLoading(btn, 'በማጠናቀቅ ላይ… / Updating…');
  try{
    const results = await Promise.all(orderIds.map(id => fetch('/api/orders/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': adminPin },
      body: JSON.stringify({ status })
    })));
    if(results.some(r=>r.status === 401)){
      isAuthenticated = false;
      if(btn) clearBtnLoading(btn);
      showToast('ፒን ትክክል አይደለም / Not authorized');
      renderAdminModal();
      return;
    }
    if(results.some(r=>!r.ok)) throw new Error('one or more PATCH /api/orders failed');
    const ms = btn ? clearBtnLoading(btn) : 0;
    showToast(`ተዘምኗል ✓ Updated (${fmtMs(ms)})`);
    loadOrders();
  }catch(e){
    const ms = btn ? clearBtnLoading(btn) : 0;
    console.error('Bulk update orders error', e);
    showToast(`ማዘመን አልተሳካም / Update failed (${fmtMs(ms)})`);
  }
}
window.setOrdersStatusBulk = setOrdersStatusBulk;

async function deleteOrdersBulk(orderIds, event){
  const msg = orderIds.length === 1
    ? 'ይህን ትዕዛዝ ማጥፋት ይፈልጋሉ?'
    : `ይህን ጠረጴዛ ${orderIds.length} ትዕዛዞችን በሙሉ ማጥፋት ይፈልጋሉ? / Delete all ${orderIds.length} orders for this table?`;
  if(!confirm(msg)) return;
  const btn = event && event.currentTarget;
  if(btn) setBtnLoading(btn, 'በማጥፋት ላይ… / Deleting…');
  try{
    const results = await Promise.all(orderIds.map(id => fetch('/api/orders/' + id, {
      method: 'DELETE',
      headers: { 'X-Admin-Pin': adminPin }
    })));
    if(results.some(r=>r.status === 401)){
      isAuthenticated = false;
      if(btn) clearBtnLoading(btn);
      showToast('ፒን ትክክል አይደለም / Not authorized');
      renderAdminModal();
      return;
    }
    if(results.some(r=>!r.ok)) throw new Error('one or more DELETE /api/orders failed');
    const ms = btn ? clearBtnLoading(btn) : 0;
    showToast(`ጠፍተዋል ✓ Deleted (${fmtMs(ms)})`);
    loadOrders();
  }catch(e){
    const ms = btn ? clearBtnLoading(btn) : 0;
    console.error('Bulk delete orders error', e);
    showToast(`ማጥፋት አልተሳካም / Delete failed (${fmtMs(ms)})`);
  }
}
window.deleteOrdersBulk = deleteOrdersBulk;

function renderOrdersList(orders){
  const el = document.getElementById('adminContent');
  if(!el || adminTab !== 'orders') return;

  if(!orders || orders.length === 0){
    el.innerHTML = `<div class="empty-admin-hint">እስካሁን ምንም ትዕዛዝ የለም / No orders yet</div>`;
    return;
  }

  const grouped = groupOrdersForDisplay(orders);
  el.innerHTML = grouped.map(entry => entry.type === 'bundle' ? renderOrderBundleCard(entry) : renderSingleOrderCard(entry.order)).join('');
}

function renderSingleOrderCard(o){
  const doneCls = o.status === 'done' ? 'is-done' : '';
  const pillCls = o.status === 'done' ? 'done' : '';
  const pillText = o.status === 'done' ? 'ተጠናቋል / Done' : 'አዲስ / New';
  const itemsLine = (o.items || []).map(it=>`${escapeHtml(it.name)} ×${it.qty}`).join(', ');
  const isDineIn = o.orderType === 'dine_in';
  const dineInText = o.tableLabel ? `🍽️ ጠረጴዛ ${escapeHtml(o.tableLabel)}` : '🍽️ እዚሁ';
  const typeBadge = `<span class="order-type-badge ${isDineIn ? 'dine-in' : 'takeaway'}">${isDineIn ? dineInText : '🥡 ወደ ውጭ'}</span>`;
  return `<div class="order-card ${doneCls}">
      <div class="order-card-head">
        <div>
          <div class="order-card-name">${escapeHtml(o.name)} ${o.code ? `<span class="order-card-code">#${escapeHtml(o.code)}</span>` : ''} ${typeBadge}</div>
          <div class="order-card-phone">${o.phone ? `📞 ${escapeHtml(o.phone)}` : ''}</div>
        </div>
        <div style="text-align:right;">
          <div class="order-status-pill ${pillCls}">${pillText}</div>
          <div class="order-card-time">${formatOrderTime(o.createdAt)}</div>
        </div>
      </div>
      <div class="order-card-items">${itemsLine}</div>
      ${o.paymentScreenshot ? `<div class="order-card-screenshot">
        <img class="order-screenshot-thumb" src="${o.paymentScreenshot}" alt="Payment screenshot" onclick="openImageLightbox(this.src)" title="ትልቅ ለማየት ይጫኑ / Tap to view full size">
        <div class="empty-admin-hint" style="text-align:left; padding:4px 0 0; font-size:11px;">👆 ክፍያውን እራስዎ ያረጋግጡ / Please verify this payment manually</div>
      </div>` : ''}
      <div class="order-card-foot">
        <div class="order-card-total">${Number(o.total).toLocaleString()} ብር</div>
        <div class="order-card-actions">
          ${o.status === 'done'
            ? `<button class="btn btn-outline btn-sm" onclick="setOrderStatus(${o.id}, 'new', event)">↺ አዲስ አድርግ</button>`
            : `<button class="btn btn-primary btn-sm" onclick="setOrderStatus(${o.id}, 'done', event)">✓ ተጠናቋል</button>`}
          <button class="btn btn-danger btn-sm" onclick="deleteOrder(${o.id}, event)">አጥፋ</button>
        </div>
      </div>
    </div>`;
}

// One card per table, combining every active (not-yet-done) order placed
// from that table's QR code into a single view with a bulk "mark done" /
// "delete" action, instead of one card per item added.
function renderOrderBundleCard(bundle){
  const orders = bundle.orders;
  const ids = orders.map(o=>o.id);
  const mergedItems = mergeBundleItems(orders);
  const itemsLine = mergedItems.map(it=>`${escapeHtml(it.name)} ×${it.qty}`).join(', ');
  const total = orders.reduce((sum,o)=>sum + Number(o.total || 0), 0);
  const latestTime = orders.reduce((latest,o)=> !latest || new Date(o.createdAt) > new Date(latest) ? o.createdAt : latest, null);
  const codes = orders.map(o=>o.code).filter(Boolean);
  const orderCountLabel = orders.length === 1 ? '1 ትዕዛዝ / 1 order' : `${orders.length} ትዕዛዞች / ${orders.length} orders`;

  return `<div class="order-card is-bundle">
      <div class="order-card-head">
        <div>
          <div class="order-card-name">🍽️ ጠረጴዛ ${escapeHtml(bundle.tableLabel)} <span class="order-bundle-count">${orderCountLabel}</span></div>
          ${codes.length ? `<div class="order-bundle-codes">${codes.map(c=>'#'+escapeHtml(c)).join(', ')}</div>` : ''}
        </div>
        <div style="text-align:right;">
          <div class="order-status-pill">አዲስ / New</div>
          <div class="order-card-time">${formatOrderTime(latestTime)}</div>
        </div>
      </div>
      <div class="order-card-items">${itemsLine}</div>
      <div class="order-card-foot">
        <div class="order-card-total">${total.toLocaleString()} ብር</div>
        <div class="order-card-actions">
          <button class="btn btn-primary btn-sm" onclick="setOrdersStatusBulk([${ids.join(',')}], 'done', event)">✓ ሁሉንም ጨርስ / Mark all done</button>
          <button class="btn btn-danger btn-sm" onclick="deleteOrdersBulk([${ids.join(',')}], event)">አጥፋ</button>
        </div>
      </div>
    </div>`;
}


async function setOrderStatus(orderId, status, event){
  const btn = event && event.currentTarget;
  if(btn) setBtnLoading(btn, status === 'done' ? 'በማጠናቀቅ ላይ… / Completing…' : 'በማዘመን ላይ… / Updating…');
  try{
    const res = await fetch('/api/orders/' + orderId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': adminPin },
      body: JSON.stringify({ status })
    });
    if(res.status === 401){
      isAuthenticated = false;
      if(btn) clearBtnLoading(btn);
      showToast('ፒን ትክክል አይደለም / Not authorized');
      renderAdminModal();
      return;
    }
    if(!res.ok) throw new Error('PATCH order failed: ' + res.status);
    const ms = btn ? clearBtnLoading(btn) : 0;
    showToast(`ተዘምኗል ✓ Updated (${fmtMs(ms)})`);
    loadOrders();
  }catch(e){
    const ms = btn ? clearBtnLoading(btn) : 0;
    console.error('Update order error', e);
    showToast(`ማዘመን አልተሳካም / Update failed (${fmtMs(ms)})`);
  }
}
window.setOrderStatus = setOrderStatus;

async function deleteOrder(orderId, event){
  if(!confirm('ይህን ትዕዛዝ ማጥፋት ይፈልጋሉ?')) return;
  const btn = event && event.currentTarget;
  if(btn) setBtnLoading(btn, 'በማጥፋት ላይ… / Deleting…');
  try{
    const res = await fetch('/api/orders/' + orderId, {
      method: 'DELETE',
      headers: { 'X-Admin-Pin': adminPin }
    });
    if(res.status === 401){
      isAuthenticated = false;
      if(btn) clearBtnLoading(btn);
      showToast('ፒን ትክክል አይደለም / Not authorized');
      renderAdminModal();
      return;
    }
    if(!res.ok) throw new Error('DELETE order failed: ' + res.status);
    const ms = btn ? clearBtnLoading(btn) : 0;
    showToast(`ጠፍቷል ✓ Deleted (${fmtMs(ms)})`);
    loadOrders();
  }catch(e){
    const ms = btn ? clearBtnLoading(btn) : 0;
    console.error('Delete order error', e);
    showToast(`ማጥፋት አልተሳካም / Delete failed (${fmtMs(ms)})`);
  }
}
window.deleteOrder = deleteOrder;

/* ============================ INIT ============================ */
async function init(){
  // Mark this as the "nothing open" floor for our nav stack. Any state a
  // previous session may have left behind (e.g. a hard refresh mid-checkout)
  // is discarded — a fresh load always starts fully closed, and pressing
  // back from here leaves the app like a normal page, as expected.
  const cleanSearch = initTableContext();
  history.replaceState({ navIndex: 0 }, '', location.pathname + cleanSearch);
  renderBgRings();
  await loadData();
  renderAll();
  renderCartFab();
  initCatNavScroll();
  document.getElementById('loadingScreen').style.display = 'none';
}
init();
</script>
