<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ebuka Coffee - ኢቡካ ቡና | ምግብ ዝርዝር</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E8672B;
    --orange-dark:#C94E1B;
    --orange-light:#F4914F;
    --gold:#D9A441;
    --coffee:#3D2015;
    --coffee-soft:#5A3826;
    --cream:#FFF8F0;
    --plate:#FFFFFF;
    --ink:#3D2015;
    --muted:#9A7E6E;
    --shadow: 0 2px 12px rgba(61,32,21,0.10);
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans Ethiopic','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .brand-font{font-family:'Noto Serif Ethiopic','Noto Sans Ethiopic',serif;}

  /* ---------- background texture ---------- */
  .bg-rings{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .bg-rings span{
    position:absolute; border-radius:50%; border:2px solid rgba(232,103,43,0.06);
  }

  /* ---------- header ---------- */
  header.top{
    position:relative; z-index:2;
    background:linear-gradient(160deg, var(--orange) 0%, var(--orange-dark) 55%, var(--coffee) 130%);
    padding:26px 20px 22px;
    border-radius:0 0 28px 28px;
    box-shadow:0 6px 24px rgba(61,32,21,0.22);
    overflow:hidden;
  }
  .header-inner{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:14px; max-width:640px; margin:0 auto;
  }
  .jebena{ width:52px; height:52px; flex-shrink:0; opacity:0.95; }
  .brand-text h1{
    margin:0; color:#fff; font-size:22px; line-height:1.25; font-weight:700;
    letter-spacing:0.2px;
  }
  .brand-text .sub-en{
    display:block; font-family:'Noto Sans Ethiopic',sans-serif; font-size:11px; font-weight:500;
    letter-spacing:2.5px; text-transform:uppercase; color:rgba(255,255,255,0.75); margin-top:2px;
  }
  .brand-text .tagline{
    margin:6px 0 0; color:rgba(255,255,255,0.88); font-size:13px; font-weight:500;
  }
  .steam{
    position:absolute; right:-10px; top:-20px; width:140px; height:140px; opacity:0.10;
  }

  /* ---------- category chips ---------- */
  .cat-nav-wrap{ position: sticky; top:0; z-index:5; background:var(--cream); padding:14px 0 6px; }
  .cat-nav{
    display:flex; gap:10px; overflow-x:auto; padding:4px 20px 10px;
    scrollbar-width:none; max-width:640px; margin:0 auto;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0; padding:10px 18px; border-radius:999px; border:2px solid rgba(232,103,43,0.18);
    background:#fff; color:var(--orange-dark); font-weight:600; font-size:14px; cursor:pointer;
    white-space:nowrap; transition:all .18s ease; font-family:'Noto Sans Ethiopic',sans-serif;
  }
  .cat-chip:hover{ border-color: var(--orange); }
  .cat-chip.active{
    background:linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(232,103,43,0.35);
  }

  /* ---------- main / grid ---------- */
  main{ position:relative; z-index:1; max-width:640px; margin:0 auto; padding:8px 16px 60px; }
  .cat-heading{
    display:flex; align-items:baseline; gap:10px; margin:18px 4px 14px;
  }
  .cat-heading h2{ margin:0; font-size:19px; font-weight:700; }
  .cat-heading .count{ font-size:12px; color:var(--muted); font-weight:500; }

  .grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:520px){ .grid{ grid-template-columns:1fr 1fr; } }

  .item-card{
    position:relative; background:var(--plate); border-radius:var(--radius);
    padding:18px 16px 16px; box-shadow:var(--shadow);
    display:flex; gap:12px; align-items:flex-start; overflow:hidden;
    animation:riseIn .35s ease both;
  }
  .item-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg, var(--gold), var(--orange) 45%, var(--gold));
  }
  .item-card::after{
    content:""; position:absolute; inset:9px; border-radius:14px;
    border:1px dashed rgba(232,103,43,0.14); pointer-events:none;
  }
  @keyframes riseIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .item-icon{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #FFF3E4, var(--cream));
    box-shadow:inset 0 0 0 2px rgba(232,103,43,0.20);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .item-body{ flex:1; min-width:0; }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .item-name{ font-weight:700; font-size:15.5px; line-height:1.3; }
  .item-name-en{ display:block; font-size:11.5px; color:var(--muted); font-weight:500; margin-top:1px; }
  .item-desc{ font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .price-pill{
    flex-shrink:0; background:linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff; padding:6px 13px; border-radius:999px; font-weight:700; font-size:13px;
    white-space:nowrap; box-shadow:0 3px 8px rgba(232,103,43,0.3);
  }
  .unavailable-badge{
    display:inline-block; margin-top:8px; font-size:11px; font-weight:700; color:#B23A2B;
    background:#FBE3DD; padding:3px 9px; border-radius:999px;
  }
  .item-card.is-unavailable{ opacity:0.55; }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--muted);
  }
  .empty-state .emoji{ font-size:38px; display:block; margin-bottom:10px; }

  /* ---------- footer ---------- */
  footer{
    position:relative; z-index:1; background:var(--coffee); color:#fff;
    text-align:center; padding:34px 20px 26px; margin-top:20px;
    border-radius:28px 28px 0 0;
  }
  footer .foot-brand{ font-size:20px; font-weight:700; letter-spacing:0.5px; }
  footer .foot-sub{ font-size:12px; color:rgba(255,255,255,0.55); margin-top:8px; letter-spacing:1px; }

  /* ---------- admin trigger ---------- */
  .admin-fab{
    position:fixed; right:16px; bottom:16px; z-index:20;
    width:46px; height:46px; border-radius:12px; border:none; cursor:pointer;
    background:var(--coffee); color:#fff; box-shadow:0 6px 18px rgba(61,32,21,0.35);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease; flex-direction:column; gap:5px; padding:12px;
  }
  .admin-fab:hover{ transform:scale(1.06); }
  .admin-fab .bar{ display:block; width:20px; height:2.5px; background:#fff; border-radius:2px; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(61,32,21,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    animation:fadeIn .18s ease both;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @media(min-width:640px){ .modal-overlay{ align-items:center; } }

  .modal{
    background:var(--cream); width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
    border-radius:24px 24px 0 0; padding:0;
    animation:slideUp .22s ease both;
  }
  @media(min-width:640px){ .modal{ border-radius:24px; max-height:85vh; } }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }

  .modal-head{
    position:sticky; top:0; background:var(--coffee); color:#fff; padding:18px 20px;
    display:flex; align-items:center; justify-content:space-between; z-index:2;
  }
  .modal-head h3{ margin:0; font-size:17px; font-weight:700; }
  .icon-btn{
    background:rgba(255,255,255,0.14); border:none; color:#fff; width:32px; height:32px;
    border-radius:50%; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .modal-body{ padding:20px; }

  .pin-screen{ text-align:center; padding:30px 10px; }
  .pin-screen .lock-emoji{ font-size:40px; }
  .pin-screen p{ color:var(--muted); font-size:13.5px; margin:8px 0 20px; }
  .pin-input{
    width:100%; max-width:220px; text-align:center; font-size:22px; letter-spacing:8px;
    padding:12px; border-radius:14px; border:2px solid rgba(232,103,43,0.25); outline:none;
    font-weight:700; color:var(--ink); background:#fff;
  }
  .pin-input:focus{ border-color:var(--orange); }
  .pin-error{ color:#B23A2B; font-size:12.5px; margin-top:8px; min-height:16px; }

  .btn{
    border:none; border-radius:12px; padding:11px 18px; font-weight:700; font-size:14px;
    cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif; transition:opacity .15s ease;
  }
  .btn:hover{ opacity:0.9; }
  .btn-primary{ background:linear-gradient(135deg, var(--orange), var(--orange-dark)); color:#fff; }
  .btn-outline{ background:#fff; color:var(--orange-dark); border:2px solid rgba(232,103,43,0.25); }
  .btn-danger{ background:#FBE3DD; color:#B23A2B; }
  .btn-block{ width:100%; margin-top:14px; }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:9px; }

  .admin-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .admin-tab{
    flex:1; text-align:center; padding:10px; border-radius:12px; border:2px solid rgba(232,103,43,0.15);
    background:#fff; color:var(--muted); font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .admin-tab.active{ background:var(--orange); color:#fff; border-color:transparent; }

  .admin-card{
    background:#fff; border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .field-row{ display:flex; gap:8px; margin-bottom:8px; }
  .field-row input, .field-row select, .field-row textarea{
    width:100%; padding:9px 11px; border-radius:10px; border:1.5px solid rgba(232,103,43,0.20);
    font-size:13.5px; font-family:'Noto Sans Ethiopic',sans-serif; color:var(--ink); outline:none; background:#FFFDFB;
  }
  .field-row input:focus, .field-row select:focus, .field-row textarea:focus{ border-color:var(--orange); }
  label.field-label{ font-size:11px; color:var(--muted); font-weight:700; display:block; margin-bottom:4px; }
  .field-group{ flex:1; min-width:0; }

  .admin-item-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .admin-item-actions{ display:flex; gap:6px; flex-shrink:0; }
  .avail-toggle{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600; cursor:pointer;
  }
  .avail-toggle input{ accent-color: var(--orange); width:16px; height:16px; }

  .section-title{ font-size:13px; font-weight:700; color:var(--coffee-soft); margin:18px 4px 10px; text-transform:uppercase; letter-spacing:1px;}
  .section-title:first-child{ margin-top:0; }

  .toast{
    position:fixed; bottom:76px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--coffee); color:#fff; padding:11px 22px; border-radius:999px; font-size:13.5px;
    font-weight:600; z-index:60; opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading-screen{
    position:fixed; inset:0; background:var(--cream); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  .loading-screen .spinner{
    width:38px; height:38px; border:4px solid rgba(232,103,43,0.2); border-top-color:var(--orange);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-screen span{ color:var(--muted); font-weight:600; font-size:13.5px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  .empty-admin-hint{ text-align:center; color:var(--muted); font-size:13px; padding:20px 10px; }

  /* ---------- ORDER CART ---------- */
  .cart-fab{
    position:fixed; left:16px; bottom:16px; z-index:20;
    width:46px; height:46px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff; box-shadow:0 6px 18px rgba(232,103,43,0.45);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    transition:transform .15s ease;
  }
  .cart-fab:hover{ transform:scale(1.06); }
  .cart-badge{
    position:absolute; top:-6px; right:-6px; background:var(--gold);
    color:var(--coffee); font-size:11px; font-weight:800;
    width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- ORDER ITEM IN MENU ---------- */
  .item-order-row{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px; }
  .qty-ctrl{ display:flex; align-items:center; gap:6px; }
  .qty-btn{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--orange);
    background:#fff; color:var(--orange); font-size:16px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    line-height:1; transition:background .12s;
  }
  .qty-btn:hover{ background:var(--orange); color:#fff; }
  .qty-num{ font-weight:700; font-size:14px; min-width:18px; text-align:center; }
  .add-to-cart-btn{
    flex:1; background:linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff; border:none; border-radius:999px; padding:7px 14px;
    font-size:13px; font-weight:700; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif;
    white-space:nowrap; box-shadow:0 2px 8px rgba(232,103,43,0.3);
  }

  /* ---------- ORDER TABS INSIDE ADMIN ---------- */
  .order-card{
    background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:12px;
    box-shadow:var(--shadow); border-left:4px solid var(--orange);
  }
  .order-card.status-paid{ border-left-color:#2A9D5C; }
  .order-card.status-cancelled{ border-left-color:#B23A2B; opacity:0.7; }
  .order-meta{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .order-id{ font-size:11px; color:var(--muted); font-weight:700; letter-spacing:0.5px; }
  .order-time{ font-size:11px; color:var(--muted); }
  .order-status-pill{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .status-pending .order-status-pill{ background:#FFF3CD; color:#9A6700; }
  .status-paid .order-status-pill{ background:#D4EDDA; color:#155724; }
  .status-cancelled .order-status-pill{ background:#FBE3DD; color:#B23A2B; }
  .order-items-list{ margin:10px 0 8px; font-size:13px; line-height:1.8; }
  .order-total{ font-weight:700; font-size:15px; color:var(--coffee); }
  .order-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .order-table{ font-size:12px; color:var(--muted); font-weight:600; }

  /* ---------- PAYMENT / CBE AREA ---------- */
  .cbe-upload-area{
    border:2px dashed rgba(232,103,43,0.3); border-radius:16px; padding:28px 20px;
    text-align:center; cursor:pointer; transition:border-color .2s; background:#FFFDFB;
    margin-bottom:16px;
  }
  .cbe-upload-area:hover{ border-color:var(--orange); }
  .cbe-upload-area .upload-icon{ font-size:36px; display:block; margin-bottom:8px; }
  .cbe-upload-area p{ margin:0; font-size:13px; color:var(--muted); }
  .cbe-upload-area.drag-over{ border-color:var(--orange); background:rgba(232,103,43,0.04); }

  .cbe-preview{ width:100%; border-radius:12px; margin:10px 0; max-height:220px; object-fit:contain; }

  .verify-result{
    border-radius:14px; padding:14px 16px; margin-top:12px; font-size:13.5px; line-height:1.6;
  }
  .verify-result.success{ background:#D4EDDA; color:#155724; border:1.5px solid #A8D5B5; }
  .verify-result.failure{ background:#FBE3DD; color:#B23A2B; border:1.5px solid #F4B8AD; }
  .verify-result.analyzing{ background:#FFF3CD; color:#9A6700; border:1.5px solid #FFE08A; }

  .pay-order-select{
    width:100%; padding:10px 12px; border-radius:12px; border:1.5px solid rgba(232,103,43,0.22);
    font-size:14px; font-family:'Noto Sans Ethiopic',sans-serif; color:var(--ink);
    background:#FFFDFB; outline:none; margin-bottom:12px;
  }
  .pay-order-select:focus{ border-color:var(--orange); }

  .cbe-info-box{
    background:rgba(217, 164, 65, 0.10); border:1.5px solid rgba(217,164,65,0.3);
    border-radius:14px; padding:14px 16px; margin-bottom:16px; font-size:13px; line-height:1.7;
  }
  .cbe-info-box strong{ color:var(--coffee); }
  .cbe-info-box .acct{ font-size:20px; font-weight:800; letter-spacing:2px; color:var(--orange-dark); display:block; margin:4px 0; }
  .spinner-inline{
    display:inline-block; width:16px; height:16px; border:2.5px solid rgba(232,103,43,0.2);
    border-top-color:var(--orange); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px;
  }
  .admin-tabs{ flex-wrap:wrap; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <span>ምናሌ በመጫን ላይ... / Loading menu...</span>
</div>

<div class="bg-rings" id="bgRings"></div>

<header class="top">
  <svg class="steam" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="white"/></svg>
  <div class="header-inner">
    <svg class="jebena" viewBox="0 0 64 64" fill="none">
      <ellipse cx="32" cy="54" rx="16" ry="6" fill="#fff" opacity="0.25"/>
      <path d="M20 30c0-9 5-16 12-16s12 7 12 16v12c0 6-5 11-12 11s-12-5-12-11V30z" fill="#fff" opacity="0.9"/>
      <path d="M44 26c6 1 9 5 9 9s-4 7-8 7" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.85" stroke-linecap="round"/>
      <rect x="29" y="8" width="6" height="10" rx="2" fill="#fff" opacity="0.9"/>
      <circle cx="32" cy="6" r="3" fill="#fff" opacity="0.9"/>
      <path d="M17 26c-2-6 0-12 4-15" stroke="#fff" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    </svg>
    <div class="brand-text">
      <h1 class="brand-font">Ebuka Coffee ‑ ኢቡካ ቡና<span class="sub-en">Restaurant &amp; Coffee House</span></h1>
      <p class="tagline">የምግብ ዝርዝር — ይመልከቱ እና ይምረጡ</p>
    </div>
  </div>
</header>

<div class="cat-nav-wrap">
  <nav class="cat-nav" id="catNav"></nav>
</div>

<main>
  <div class="cat-heading" id="catHeading"></div>
  <div class="grid" id="itemGrid"></div>
</main>

<footer>
  <div class="foot-brand brand-font">ኢቡካ የማይተካ</div>
  <div class="foot-sub">EBUKA COFFEE · ADDIS ABABA</div>
</footer>

<button class="cart-fab" id="cartFab" title="Cart" style="display:none; position:relative;">
  🛒<span class="cart-badge" id="cartBadge">0</span>
</button>
<button class="admin-fab" id="adminFab" title="Admin Menu">
  <span class="bar"></span><span class="bar"></span><span class="bar"></span>
</button>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ DATA ============================ */
function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let state = null;
let activeCategory = null;
let isAuthenticated = false;
let adminTab = 'categories';
let adminPin = '';

// ---- Cart & Orders ----
let cart = [];          // [{itemId, name, price, qty}]
let orders = JSON.parse(localStorage.getItem('ebuka_orders') || '[]');  // persisted locally

// CBE payment details – update to real account
const CBE_ACCOUNT = '1000123456789';
const CBE_NAME    = 'Ebuka Coffee';

function saveOrders(){ localStorage.setItem('ebuka_orders', JSON.stringify(orders)); }

/* ============================ STORAGE (Flask API) ============================ */
async function loadData(){
  try{
    const res = await fetch('/api/menu');
    if(!res.ok) throw new Error('GET /api/menu failed: ' + res.status);
    state = await res.json();
  }catch(e){
    console.error('Load error', e);
    state = { categories: [], items: [] };
    showToast('⚠️ Could not reach the server / ሰርቨሩ ላይ መድረስ አልተቻለም');
  }
  activeCategory = state.categories[0] ? state.categories[0].id : null;
}

async function saveData(showToastMsg){
  try{
    const res = await fetch('/api/menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': adminPin },
      body: JSON.stringify(state)
    });
    if(res.status === 401){
      isAuthenticated = false;
      if(showToastMsg !== false){ showToast('ፒን ትክክል አይደለም / Not authorized — please log in again'); }
      renderAdminModal();
      return false;
    }
    if(!res.ok) throw new Error('POST /api/menu failed: ' + res.status);
    if(showToastMsg !== false){ showToast('ተቀምጧል ✓ Saved'); }
    return true;
  }catch(e){
    console.error('Save error', e);
    if(showToastMsg !== false){ showToast('ማስቀመጥ አልተሳካም / Save failed'); }
    return false;
  }
}

function renderMenu(){
  const cat = state.categories.find(c=>c.id===activeCategory);
  const heading = document.getElementById('catHeading');
  const grid = document.getElementById('itemGrid');
  const items = state.items.filter(i=>i.categoryId===activeCategory);

  heading.innerHTML = cat ? `<h2 class="brand-font">${escapeHtml(cat.name)}</h2><span class="count">${items.length} ንጥሎች</span>` : '';

  if(items.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <span class="emoji">🍽️</span>
      በዚህ ምድብ ውስጥ ምንም ምግብ የለም
    </div>`;
    return;
  }

  grid.innerHTML = items.map(it=>{
    const unavailCls = it.available === false ? 'is-unavailable' : '';
    const badge = it.available === false ? `<span class="unavailable-badge">አልቀረም / Unavailable</span>` : '';
    const nameEn = it.nameEn ? `<span class="item-name-en">${escapeHtml(it.nameEn)}</span>` : '';
    const desc = it.desc ? `<div class="item-desc">${escapeHtml(it.desc)}</div>` : '';
    const cartEntry = cart.find(c=>c.itemId===it.id);
    const qty = cartEntry ? cartEntry.qty : 0;
    const orderRow = it.available !== false ? `
      <div class="item-order-row">
        ${qty > 0 ? `
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty('${it.id}',-1)">−</button>
            <span class="qty-num">${qty}</span>
            <button class="qty-btn" onclick="changeQty('${it.id}',1)">+</button>
          </div>
        ` : `
          <button class="add-to-cart-btn" onclick="changeQty('${it.id}',1)">🛒 ጨምር / Add</button>
        `}
      </div>` : '';
    return `<div class="item-card ${unavailCls}">
      <div class="item-icon">${it.icon || '🍽️'}</div>
      <div class="item-body">
        <div class="item-top">
          <div>
            <div class="item-name">${escapeHtml(it.name)}</div>
            ${nameEn}
          </div>
          <div class="price-pill">${Number(it.price).toLocaleString()} ብር</div>
        </div>
        ${desc}
        ${badge}
        ${orderRow}
      </div>
    </div>`;
  }).join('');
}

/* ============================ CART ============================ */
function changeQty(itemId, delta){
  const item = state.items.find(i=>i.id===itemId);
  if(!item) return;
  const idx = cart.findIndex(c=>c.itemId===itemId);
  if(idx === -1){
    if(delta > 0) cart.push({ itemId, name:item.name, nameEn:item.nameEn||'', price:item.price, qty:1 });
  } else {
    cart[idx].qty += delta;
    if(cart[idx].qty <= 0) cart.splice(idx,1);
  }
  updateCartFab();
  renderMenu();
}
window.changeQty = changeQty;

function updateCartFab(){
  const fab = document.getElementById('cartFab');
  const badge = document.getElementById('cartBadge');
  const total = cart.reduce((s,c)=>s+c.qty,0);
  fab.style.display = total > 0 ? 'flex' : 'none';
  badge.textContent = total;
}

function openCart(){
  const total = cart.reduce((s,c)=>s+(c.price*c.qty),0);
  const tableNum = prompt('የጠረጴዛ ቁጥር ያስገቡ / Enter table number:','');
  if(tableNum === null) return;
  const order = {
    id: uid('ord'),
    table: tableNum || '—',
    items: cart.map(c=>({...c})),
    total,
    status: 'pending',
    time: new Date().toISOString(),
    paymentProof: null,
    paymentVerified: false,
  };
  orders.unshift(order);
  saveOrders();
  cart = [];
  updateCartFab();
  renderMenu();
  showToast(`✅ ትዕዛዝ ተቀበለ! Order #${order.id.slice(-5)}`);
}
document.getElementById('cartFab').addEventListener('click', openCart);

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderAll(){
  renderCatNav();
  renderMenu();
}

/* ============================ TOAST ============================ */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

const modalRoot = document.getElementById('modalRoot');

function openAdmin(){
  isAuthenticated = false;

  renderAdminModal();
}
document.getElementById('adminFab').addEventListener('click', openAdmin);

function closeAdmin(){

}

function renderAdminModal(){

    modalRoot.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeAdmin()">
        <div class="modal">
          <div class="modal-head">
            <h3>የአስተዳዳሪ መግቢያ / Admin</h3>
            <button class="icon-btn" onclick="closeAdmin()">✕</button>
          </div>
          <div class="modal-body">
            <div class="pin-screen">
              <div class="lock-emoji">🔒</div>
              <p>ምናሌውን ለማስተካከል የ4 አሃዝ ፒን ያስገቡ<br>Enter the 4-digit admin PIN to edit the menu</p>
              <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="pinInput" placeholder="••••">
              <div class="pin-error" id="pinError"></div>

            </div>
          </div>
        </div>
      </div>`;

    input.focus();
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') checkPin(); });

  }

  modalRoot.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeAdmin()">
      <div class="modal">
        <div class="modal-head">
          <h3>የአስተዳዳሪ ፓነል / Admin Panel</h3>
          <button class="icon-btn" onclick="closeAdmin()">✕</button>
        </div>
        <div class="modal-body">
          <div class="admin-tabs">
            <div class="admin-tab ${adminTab==='categories'?'active':''}" onclick="switchAdminTab('categories')">ምድቦች</div>
            <div class="admin-tab ${adminTab==='items'?'active':''}" onclick="switchAdminTab('items')">ምግቦች</div>
            <div class="admin-tab ${adminTab==='orders'?'active':''}" onclick="switchAdminTab('orders')">ትዕዛዞች ${pendingCount>0?`<span style="background:#E8672B;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:2px;">${pendingCount}</span>`:''}</div>
            <div class="admin-tab ${adminTab==='payments'?'active':''}" onclick="switchAdminTab('payments')">ክፍያ / Pay</div>
          </div>
          <div id="adminContent"></div>
        </div>
      </div>
    </div>`;
  renderAdminContent();
}

async function checkPin(){
  const val = document.getElementById('pinInput').value;
  const errEl = document.getElementById('pinError');
  errEl.textContent = '';
  try{
    const res = await fetch('/api/admin/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: val })
    });
    const data = await res.json();
    if(data && data.ok){
      adminPin = val;
      isAuthenticated = true;
      renderAdminModal();
    } else {
      errEl.textContent = 'ትክክል ያልሆነ ፒን / Incorrect PIN';
    }
  }catch(e){
    console.error('PIN check error', e);
    errEl.textContent = 'ሰርቨሩ ላይ መድረስ አልተቻለም / Could not reach server';
  }
}
window.checkPin = checkPin;

function switchAdminTab(tab){
  adminTab = tab;
  renderAdminModal();
}
window.switchAdminTab = switchAdminTab;

function renderAdminContent(){
  const el = document.getElementById('adminContent');
  if(adminTab === 'categories') el.innerHTML = renderAdminCategories();
  else if(adminTab === 'items') el.innerHTML = renderAdminItems();
  else if(adminTab === 'orders') el.innerHTML = renderAdminOrders();
  else if(adminTab === 'payments') renderAdminPayments(el);
}

  return `

function renameCategory(id, newName){
  const cat = state.categories.find(c=>c.id===id);
  if(!cat) return;
  if(!newName.trim()){ showToast('ስም ባዶ መሆን አይችልም'); renderAdminContent(); return; }
  cat.name = newName.trim();
  saveData();
  renderAll();
  renderAdminContent();
}
window.renameCategory = renameCategory;

function deleteCategory(id){
  const itemCount = state.items.filter(i=>i.categoryId===id).length;
  const msg = itemCount > 0
    ? `ይህ ምድብ ${itemCount} ምግቦችን ይዟል። ምድቡን ማጥፋት እነዚህንም ምግቦች ያጠፋል። እርግጠኛ ነዎት?`
    : 'ይህን ምድብ ማጥፋት ይፈልጋሉ?';
  if(!confirm(msg)) return;
  state.categories = state.categories.filter(c=>c.id!==id);
  state.items = state.items.filter(i=>i.categoryId!==id);
  if(activeCategory === id){
    activeCategory = state.categories[0] ? state.categories[0].id : null;
  }
  saveData();
  renderAll();
  renderAdminContent();
}
window.deleteCategory = deleteCategory;

function addCategory(){
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if(!name){ showToast('እባክዎ ስም ያስገቡ'); return; }
  const newCat = { id: uid('cat'), name };
  state.categories.push(newCat);
  if(!activeCategory) activeCategory = newCat.id;
  saveData();
  renderAll();
  renderAdminContent();
}
window.addCategory = addCategory;

        <div class="field-row">

          </div>
          <div class="field-group">

          </div>

            <label class="field-label">Icon</label>
            <input type="text" value="${escapeHtml(it.icon||'')}" onchange="updateItem('${it.id}','icon',this.value)">
          </div>
          <div class="field-group">
            <label class="field-label">ምድብ / Category</label>
            <select onchange="updateItem('${it.id}','categoryId',this.value)">
              ${state.categories.map(c=>`<option value="${c.id}" ${c.id===it.categoryId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">መግለጫ / Description</label>
            <input type="text" value="${escapeHtml(it.desc||'')}" onchange="updateItem('${it.id}','desc',this.value)">
          </div>
        </div>
        <div class="admin-item-row">
          <label class="avail-toggle">
            <input type="checkbox" ${it.available!==false?'checked':''} onchange="updateItem('${it.id}','available',this.checked)">

          </label>
          <button class="btn btn-danger btn-sm" onclick="deleteItem('${it.id}')">አጥፋ / Delete</button>

      <div class="field-row">
        <div class="field-group">

function updateItem(id, field, value){
  const item = state.items.find(i=>i.id===id);
  if(!item) return;
  if(field === 'price'){
    const num = parseFloat(value);
    item.price = isNaN(num) ? 0 : num;
  } else if(field === 'available'){
    item.available = !!value;
  } else {
    item[field] = value;
  }
  saveData();
  renderAll();
  renderAdminContent();
}
window.updateItem = updateItem;

function deleteItem(id){
  if(!confirm('ይህን ምግብ ማጥፋት ይፈልጋሉ?')) return;
  state.items = state.items.filter(i=>i.id!==id);
  saveData();
  renderAll();
  renderAdminContent();
}
window.deleteItem = deleteItem;

function addItem(){
  const name = document.getElementById('newItemName').value.trim();
  const nameEn = document.getElementById('newItemNameEn').value.trim();
  const price = parseFloat(document.getElementById('newItemPrice').value) || 0;
  const icon = document.getElementById('newItemIcon').value.trim() || '🍽️';
  const categoryId = document.getElementById('newItemCategory').value;
  const desc = document.getElementById('newItemDesc').value.trim();

  if(!name){ showToast('እባክዎ የምግብ ስም ያስገቡ'); return; }
  if(!categoryId){ showToast('እባክዎ ምድብ ይምረጡ'); return; }

  state.items.push({ id: uid('i'), categoryId, name, nameEn, price, desc, icon, available:true });
  saveData();
  renderAll();
  renderAdminContent();
}
window.addItem = addItem;

/* ============================ ORDERS ADMIN ============================ */
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('am-ET',{day:'2-digit',month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('am-ET',{hour:'2-digit',minute:'2-digit'});
}

function renderAdminOrders(){
  if(orders.length === 0){
    return `<div class="empty-admin-hint">ምንም ትዕዛዝ የለም / No orders yet</div>`;
  }
  const statusLabel = {pending:'⏳ በመጠበቅ ላይ', paid:'✅ ተከፍሏል', cancelled:'❌ ተሰርዟል'};
  return orders.map(ord=>`
    <div class="order-card status-${ord.status}">
      <div class="order-meta">
        <span class="order-id">ORD-${ord.id.slice(-6).toUpperCase()}</span>
        <span class="order-table">🪑 ጠረጴዛ ${escapeHtml(ord.table)}</span>
        <span class="order-time">${fmtTime(ord.time)}</span>
        <span class="order-status-pill">${statusLabel[ord.status]||ord.status}</span>
      </div>
      <div class="order-items-list">${ord.items.map(i=>`${escapeHtml(i.name)} × ${i.qty} — ${Number(i.price*i.qty).toLocaleString()} ብር`).join('<br>')}</div>
      <div class="order-total">ጠቅላላ: ${Number(ord.total).toLocaleString()} ብር ${ord.paymentVerified ? '✅ ክፍያ ተረጋግጧል' : ''}</div>
      <div class="order-actions">
        ${ord.status==='pending' ? `
          <button class="btn btn-sm" style="background:#D4EDDA;color:#155724;" onclick="setOrderStatus('${ord.id}','paid')">✅ ክፍሉ</button>
          <button class="btn btn-sm btn-danger" onclick="setOrderStatus('${ord.id}','cancelled')">❌ ሰርዝ</button>
        ` : ''}
        ${ord.status==='paid' ? `<button class="btn btn-sm btn-outline" onclick="setOrderStatus('${ord.id}','pending')">↩ ወደ ቀደሙ ቀይር</button>` : ''}
        <button class="btn btn-sm btn-danger" onclick="deleteOrder('${ord.id}')">🗑 አጥፋ</button>
      </div>
    </div>
  `).join('');
}

function setOrderStatus(id, status){
  const ord = orders.find(o=>o.id===id);
  if(ord){ ord.status=status; saveOrders(); renderAdminModal(); }
}
window.setOrderStatus = setOrderStatus;

function deleteOrder(id){
  if(!confirm('ይህን ትዕዛዝ ማጥፋት ይፈልጋሉ?')) return;
  orders = orders.filter(o=>o.id!==id);
  saveOrders();
  renderAdminModal();
}
window.deleteOrder = deleteOrder;

/* ============================ PAYMENTS ADMIN ============================ */
let cbeImageData = null;  // base64 of the uploaded screenshot

function renderAdminPayments(container){
  const pendingOrds = orders.filter(o=>o.status==='pending');
  const optionsHtml = pendingOrds.length === 0
    ? `<option value="">— ምንም ተጠባቂ ትዕዛዝ የለም —</option>`
    : pendingOrds.map(o=>`<option value="${o.id}">ORD-${o.id.slice(-6).toUpperCase()} · ጠረጴዛ ${escapeHtml(o.table)} · ${Number(o.total).toLocaleString()} ብር</option>`).join('');

  container.innerHTML = `
    <div class="section-title">CBE ቢርር ክፍያ ማረጋገጫ / CBE Birr Payment Verification</div>

    <div class="cbe-info-box">
      <strong>የCBE ቢርር ቁጥር / CBE Birr Account:</strong>
      <span class="acct">${CBE_ACCOUNT}</span>
      <strong>${CBE_NAME}</strong><br>
      <small>ደንበኞች ይህን ቁጥር ወደ CBE ቢርር ካፕሊኬሽን አክለው ክፍያ ይፈጽሙ። የQR ኮድ ስሪን ሾት ወደዚህ ያስገቡ።</small>
    </div>

    <div class="field-group" style="margin-bottom:12px;">
      <label class="field-label">ለምን ትዕዛዝ ክፍያ ነው? / Which order?</label>
      <select class="pay-order-select" id="payOrderSelect">${optionsHtml}</select>
    </div>

    <div class="cbe-upload-area" id="cbeUploadArea" onclick="document.getElementById('cbeFileInput').click()">
      <span class="upload-icon">📷</span>
      <p>የCBE ቢርር ክፍያ ስሪን ሾት ያስገቡ<br><small>Click to upload or drag & drop</small></p>
      <input type="file" id="cbeFileInput" accept="image/*" style="display:none" onchange="onCbeFileSelected(event)">
    </div>

    <div id="cbePreviewArea" style="display:none;">
      <img id="cbePreviewImg" class="cbe-preview" src="" alt="screenshot preview">
      <button class="btn btn-outline btn-sm" onclick="clearCbeImage()">🔄 ሌላ ምስል / Change image</button>
    </div>

    <div id="cbeVerifyResult"></div>

    <button class="btn btn-primary btn-block" id="verifyBtn" onclick="verifyCbePayment()" style="margin-top:14px;">
      🔍 ክፍያ አረጋግጥ / Verify Payment via AI
    </button>
  `;

  // Drag & drop support
  const area = document.getElementById('cbeUploadArea');
  area.addEventListener('dragover', e=>{ e.preventDefault(); area.classList.add('drag-over'); });
  area.addEventListener('dragleave', ()=> area.classList.remove('drag-over'));
  area.addEventListener('drop', e=>{ e.preventDefault(); area.classList.remove('drag-over'); if(e.dataTransfer.files[0]) handleCbeFile(e.dataTransfer.files[0]); });

  cbeImageData = null;
}

function onCbeFileSelected(e){ if(e.target.files[0]) handleCbeFile(e.target.files[0]); }
window.onCbeFileSelected = onCbeFileSelected;

function handleCbeFile(file){
  const reader = new FileReader();
  reader.onload = evt => {
    cbeImageData = evt.target.result.split(',')[1]; // base64
    document.getElementById('cbePreviewImg').src = evt.target.result;
    document.getElementById('cbePreviewArea').style.display = 'block';
    document.getElementById('cbeUploadArea').style.display = 'none';
    document.getElementById('cbeVerifyResult').innerHTML = '';
  };
  reader.readAsDataURL(file);
}

function clearCbeImage(){
  cbeImageData = null;
  document.getElementById('cbePreviewArea').style.display = 'none';
  document.getElementById('cbeUploadArea').style.display = 'block';
  document.getElementById('cbeFileInput').value = '';
  document.getElementById('cbeVerifyResult').innerHTML = '';
}
window.clearCbeImage = clearCbeImage;

async function verifyCbePayment(){
  if(!cbeImageData){
    showToast('እባክዎ ፎቶ ያስገቡ / Please upload a screenshot first');
    return;
  }
  const select = document.getElementById('payOrderSelect');
  const orderId = select ? select.value : '';
  const order = orders.find(o=>o.id===orderId);

  const resultEl = document.getElementById('cbeVerifyResult');
  const btn = document.getElementById('verifyBtn');
  resultEl.innerHTML = `<div class="verify-result analyzing"><span class="spinner-inline"></span> AI እየፈተሸ ነው… Please wait…</div>`;
  btn.disabled = true;

  const expectedAmount = order ? order.total : null;
  const prompt = `You are a payment verification assistant for Ebuka Coffee restaurant in Addis Ababa.

Analyze this CBE Birr (Commercial Bank of Ethiopia) mobile payment screenshot carefully.

Look for:
1. QR code or transaction confirmation details
2. The amount transferred (in Birr/ETB)
3. The recipient account or name (should match "${CBE_NAME}" or account "${CBE_ACCOUNT}")
4. Transaction date and time
5. Transaction reference or ID
6. Whether this appears to be a genuine, unedited CBE Birr app screenshot (not a fake)

${expectedAmount ? `Expected payment amount: ${expectedAmount} Birr` : ''}

Respond ONLY in JSON format (no markdown, no backticks):
{
  "verified": true or false,
  "amount": number or null,
  "recipient": "string or null",
  "transactionId": "string or null",
  "date": "string or null",
  "confidence": "high" | "medium" | "low",
  "reason": "brief explanation in English",
  "amountMatch": true or false or null
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages:[{
          role:'user',
          content:[
            { type:'image', source:{ type:'base64', media_type:'image/jpeg', data: cbeImageData } },
            { type:'text', text: prompt }
          ]
        }]
      })
    });
    const data = await res.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
    let parsed;
    try{ parsed = JSON.parse(raw.replace(/```json|```/g,'').trim()); }
    catch(e){ throw new Error('Could not parse AI response: ' + raw); }

    const ok = parsed.verified && (parsed.amountMatch !== false);
    const confEmoji = parsed.confidence==='high'?'🟢':parsed.confidence==='medium'?'🟡':'🔴';

    resultEl.innerHTML = `<div class="verify-result ${ok?'success':'failure'}">
      <strong>${ok ? '✅ ክፍያ ተረጋግጧል! Payment Verified!' : '❌ ክፍያ አልተረጋገጠም / Payment NOT Verified'}</strong><br>
      ${confEmoji} <strong>Confidence:</strong> ${parsed.confidence}<br>
      <strong>Amount:</strong> ${parsed.amount != null ? Number(parsed.amount).toLocaleString() + ' ብር' : 'Not found'}
      ${expectedAmount && parsed.amount ? (parsed.amountMatch ? ' ✅ (match)' : ` ⚠️ (expected ${Number(expectedAmount).toLocaleString()} ብር)`) : ''}<br>
      <strong>Recipient:</strong> ${parsed.recipient || '—'}<br>
      <strong>Transaction ID:</strong> ${parsed.transactionId || '—'}<br>
      <strong>Date:</strong> ${parsed.date || '—'}<br>
      <strong>Notes:</strong> ${parsed.reason}
      ${ok && order ? `<br><br><button class="btn btn-sm" style="background:#2A9D5C;color:#fff;margin-top:4px;" onclick="markOrderPaidFromVerify('${order.id}')">✅ ትዕዛዙን እንደ ተከፈለ ምልክት አድርግ / Mark Order Paid</button>` : ''}
    </div>`;

    if(ok && order){
      order.paymentVerified = true;
      saveOrders();
    }
  } catch(e) {
    resultEl.innerHTML = `<div class="verify-result failure">⚠️ AI ማረጋገጥ አልተሳካም / Verification failed<br><small>${e.message}</small></div>`;
  }
  btn.disabled = false;
}
window.verifyCbePayment = verifyCbePayment;

function markOrderPaidFromVerify(ordId){
  const ord = orders.find(o=>o.id===ordId);
  if(ord){ ord.status='paid'; ord.paymentVerified=true; saveOrders(); }
  showToast('✅ ትዕዛዙ ተከፍሏል ምልክት ተደርጓል!');
  adminTab = 'orders';
  renderAdminModal();
}
window.markOrderPaidFromVerify = markOrderPaidFromVerify;

/* ============================ INIT ============================ */
async function init(){
  renderBgRings();
  await loadData();
  renderAll();
  document.getElementById('loadingScreen').style.display = 'none';
}
init();
</script>
</body>
</html>
